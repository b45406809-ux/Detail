name = "detail-api"
main = "detail-api-worker.mjs"
compatibility_date = "2026-10-05"

[[d1_databases]]
binding = "DB"
database_name = "detail"
# This harmless UUID lets Wrangler create a local D1 simulation. Replace it
# with the real ID only when you are ready to create and deploy remote D1.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "detail-photos"

[vars]
FIREBASE_PROJECT_ID = "new1-4bb94"
