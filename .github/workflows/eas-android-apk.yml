name: Build Detail Android APK on EAS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/separate-dashboard-into-routed-modules-fl7jlh
    paths:
      - '.easignore'
      - '.github/workflows/eas-android-apk.yml'
      - 'mobile/**'

permissions:
  contents: read

concurrency:
  group: eas-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build installable production-configured APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate build credentials are configured
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$MAPBOX_DOWNLOADS_TOKEN"
          test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - run: npm ci --prefix mobile --no-audit --no-fund

      - name: Verify Mapbox SDK download access
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "mapbox:$MAPBOX_DOWNLOADS_TOKEN" 'https://api.mapbox.com/downloads/v2/releases/maven/com/mapbox/maps/android/10.18.4/android-10.18.4.pom')"
          if [[ "$status" != '200' ]]; then
            echo "Mapbox rejected the downloads token (HTTP $status). Configure MAPBOX_DOWNLOADS_TOKEN with DOWNLOADS:READ scope."
            exit 1
          fi

      - name: Set Mapbox tokens in EAS production environment
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest env:set production --scope project --name MAPBOX_DOWNLOADS_TOKEN --value "$MAPBOX_DOWNLOADS_TOKEN" --visibility secret --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN --value "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" --visibility plaintext --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --visibility plaintext --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$EXPO_PUBLIC_SUPABASE_ANON_KEY" --visibility plaintext --non-interactive
          if [[ -n "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" --visibility plaintext --non-interactive
          fi
          if [[ -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" --visibility plaintext --non-interactive
          fi
          if [[ -n "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" --visibility plaintext --non-interactive
          fi

      - name: Generate Android project with the pinned Kotlin toolchain
        working-directory: mobile
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform android --no-install --clean
          git checkout -- package.json
          grep -F "kotlinVersion = '2.1.21'" android/build.gradle
          grep -F 'kotlin-gradle-plugin:2.1.21' android/build.gradle
          grep -F 'android.kotlinVersion=2.1.21' android/gradle.properties
          grep -F 'kotlin = "2.1.21"' node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml
          grep -F 'return facebook::react::RawPropsParser();' node_modules/react-native-nitro-modules/cpp/views/RawPropsCompat.cpp

      - name: Build installable Android APK on EAS
        working-directory: mobile
        run: |
          set -euo pipefail
          set +e
          npx eas-cli@latest build --platform android --profile production-apk --non-interactive --wait --json > "$RUNNER_TEMP/eas-apk-build.json"
          build_status=$?
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            echo 'EAS build command failed; response captured below for diagnosis:'
            cat "$RUNNER_TEMP/eas-apk-build.json"
            echo 'Recent EAS builds for this project:'
            build_id="$(node -e 'const fs=require("node:fs");try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/eas-apk-build.json","utf8"));const b=Array.isArray(d)?d.at(-1):d;process.stdout.write(b?.id||"")}catch{}')"
            if [[ -n "$build_id" ]]; then
              echo "Fetching detailed Gradle logs for EAS build $build_id"
              npx eas-cli@latest build:view "$build_id" --json > "$RUNNER_TEMP/eas-build-details.json" || true
              log_url="$(node -e 'const d=require(process.env.RUNNER_TEMP+"/eas-build-details.json");process.stdout.write(d.logFiles?.[0]||"")' 2>/dev/null || true)"
              if [[ -n "$log_url" ]]; then
                curl --fail --location --silent --show-error "$log_url" --output "$RUNNER_TEMP/eas-gradle.log" || true
                node -e 'const fs=require("node:fs");const zlib=require("node:zlib");const p=process.env.RUNNER_TEMP+"/eas-gradle.log";const b=fs.readFileSync(p);try{fs.writeFileSync(p,zlib.brotliDecompressSync(b))}catch{}'
                echo 'Gradle log error context:'
                rg -in -C 3 'error|failed|exception|could not|cannot|manifest merger' "$RUNNER_TEMP/eas-gradle.log" | tail -160 || tail -120 "$RUNNER_TEMP/eas-gradle.log"
              fi
            fi
            exit "$build_status"
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-apk-build.json', 'utf8'));
          const build = Array.isArray(parsed) ? parsed.at(-1) : parsed;
          const id = build?.id;
          const artifact = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
          console.log('## Android APK build');
          console.log('');
          console.log('- Profile: `production-apk` (APK, signed with the app’s EAS Android credentials)');
          if (artifact) console.log(`- [Download APK](${artifact})`);
          if (id) console.log(`- [EAS build details](https://expo.dev/accounts/detail-test/projects/detail/builds/${id})`);
          if (!artifact && !id) throw new Error('EAS completed without returning a build ID or APK download URL.');
          NODE
