name: Appetize live customer journey
on:
  workflow_dispatch:
    inputs:
      appetize_build_id:
        description: Immutable Android Appetize target ID
        required: true
        type: string
      source_commit:
        description: Full 40-character source commit that built the selected Appetize target
        required: true
        type: string
      source_workflow_run_id:
        description: GitHub run ID that built and uploaded the selected Appetize target
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  customer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_BUILD_ID: ${{ inputs.appetize_build_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source_workflow_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live booking gate
        run: node scripts/live_mobile_ui_e2e.mjs preflight
      - run: npm install --global @appetize/cli@0.25.1 --no-audit --no-fund
      - name: Validate pinned Android artifact
        run: |
          set -euo pipefail
          [[ "$APPETIZE_BUILD_ID" =~ ^[a-z0-9]{20,32}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          appetize build list --app com.detail.app --limit 200 --json --quiet > "$RUNNER_TEMP/appetize-builds.json"
          APPETIZE_BUILD_ID="$APPETIZE_BUILD_ID" SOURCE_COMMIT="$SOURCE_COMMIT" SOURCE_WORKFLOW_RUN_ID="$SOURCE_WORKFLOW_RUN_ID" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { builds = [] } = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/appetize-builds.json`, 'utf8'));
          const target = builds.find(build => build.id === process.env.APPETIZE_BUILD_ID);
          if (!target) throw new Error('The requested Appetize build ID is unavailable for com.detail.app.');
          if (target.platform !== 'android') throw new Error('The requested Appetize target is not Android.');
          if (target.note && !String(target.note).includes(process.env.SOURCE_COMMIT)) throw new Error('The Appetize build note does not match the supplied source commit.');
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' };
          const runResponse = await fetch(`${api}/actions/runs/${process.env.SOURCE_WORKFLOW_RUN_ID}`, { headers });
          if (!runResponse.ok) throw new Error(`Could not verify the source workflow run (HTTP ${runResponse.status}).`);
          const run = await runResponse.json();
          if (run.head_sha !== process.env.SOURCE_COMMIT || run.conclusion !== 'success' || run.name !== 'Appetize home panel layout screenshot') {
            throw new Error('The supplied source run did not successfully build the supplied source commit.');
          }
          const jobsResponse = await fetch(`${api}/actions/runs/${process.env.SOURCE_WORKFLOW_RUN_ID}/jobs`, { headers });
          if (!jobsResponse.ok) throw new Error(`Could not verify the Appetize upload job (HTTP ${jobsResponse.status}).`);
          const { jobs = [] } = await jobsResponse.json();
          const uploadJob = jobs.find(job => job.name === 'home-panel' && job.conclusion === 'success');
          if (!uploadJob) throw new Error('The source Appetize workflow has no successful home-panel job.');
          const logsResponse = await fetch(`${api}/actions/jobs/${uploadJob.id}/logs`, { headers });
          if (!logsResponse.ok) throw new Error(`Could not verify the source Appetize build output (HTTP ${logsResponse.status}).`);
          const logs = await logsResponse.text();
          if (!logs.includes(`APPETIZE_TARGET: ${process.env.APPETIZE_BUILD_ID}`)) throw new Error('The selected Appetize target was not uploaded by the supplied source workflow run.');
          console.log(`PINNED_APPETIZE_TARGET: ${target.id}`);
          console.log(`PINNED_SOURCE_COMMIT: ${process.env.SOURCE_COMMIT}`);
          console.log(`PINNED_SOURCE_WORKFLOW_RUN: ${process.env.SOURCE_WORKFLOW_RUN_ID}`);
          NODE
          {
            echo '## Pinned Android Appetize customer journey'
            echo
            echo "- Appetize build ID: \`$APPETIZE_BUILD_ID\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Source workflow run: \`$SOURCE_WORKFLOW_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create confirmed disposable accounts
        id: test-users
        run: node scripts/live_mobile_ui_e2e.mjs create
      - name: Sign in through Android UI
        run: |
          set -euo pipefail
          mkdir -p appetize-results
          target="$APPETIZE_BUILD_ID"
          trap 'appetize inspect appetize-results/final.json --json --quiet || true; appetize screenshot appetize-results/final.png --json --quiet || true; appetize session stop --json --quiet || true' EXIT
          measure_route() {
            name="$1"
            uri="$2"
            expected="$3"
            started="$(date +%s%3N)"
            appetize open "$uri" --json --quiet
            appetize inspect --select-text "$expected" --timeout 15000 --json --quiet
            finished="$(date +%s%3N)"
            duration_ms="$((finished - started))"
            echo "SCREEN_LOAD_MS: $name=$duration_ms"
            echo "- $name: ${duration_ms} ms until expected content appeared" >> "$GITHUB_STEP_SUMMARY"
          }
          appetize session start pixel7 --target "$target" --json --quiet >/dev/null
          appetize inspect --select-test-id welcome-skip --timeout 25000 --json --quiet
          appetize tap --select-test-id welcome-skip --json --quiet
          appetize inspect --select-test-id auth-email-tab --timeout 15000 --json --quiet
          appetize tap --select-test-id auth-email-tab --json --quiet
          appetize tap --select-test-id auth-email-mode-password --json --quiet
          measure_route 'Forgot password' 'detail:///forgot-password' 'Forgot password?'
          measure_route 'Reset password' 'detail:///reset-password' 'Choose a new password'
          measure_route 'Email verification code' 'detail:///verify-email?email=qa%40example.test&intent=SIGN_IN' 'Check your email'
          echo 'LIVE_AUTH_RECOVERY_ROUTES_RENDERED'
          appetize session stop --json --quiet
          appetize session start pixel7 --target "$target" --json --quiet >/dev/null
          appetize inspect --select-test-id welcome-skip --timeout 25000 --json --quiet
          appetize tap --select-test-id welcome-skip --json --quiet
          appetize inspect --select-test-id auth-email-tab --timeout 15000 --json --quiet
          appetize tap --select-test-id auth-email-tab --json --quiet
          appetize tap --select-test-id auth-email-mode-password --json --quiet
          appetize inspect --select-test-id auth-email-input --timeout 15000 --json --quiet
          appetize tap --select-test-id auth-email-input --json --quiet
          appetize type "$E2E_CUSTOMER_EMAIL" --json --quiet
          appetize tap --select-test-id auth-password-input --json --quiet
          appetize type "$E2E_CUSTOMER_PASSWORD" --json --quiet
          appetize press back --json --quiet
          appetize tap --select-test-id auth-email-submit --json --quiet
          appetize inspect appetize-results/agreement.json --select-text 'Customer Agreement' --timeout 25000 --json --quiet
          appetize screenshot appetize-results/agreement.png --json --quiet
          for attempt in $(seq 1 12); do
            if appetize inspect --select-text '/^I have read and accept$/i' --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
            appetize swipe --direction up --json --quiet
          done
          appetize tap --select-text '/^I have read and accept$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Set up your profile' --timeout 20000 --json --quiet
          appetize tap --select-text 'Your full name' --timeout 10000 --json --quiet
          appetize type 'E2E Live Customer' --json --quiet
          appetize press back --json --quiet
          appetize tap --select-text '/^Continue$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Allow permissions' --timeout 20000 --json --quiet
          appetize tap --select-text '/^Continue to App$/i' --timeout 10000 --json --quiet
          appetize inspect appetize-results/home.json --select-text '/^House$/i' --timeout 25000 --json --quiet
          appetize screenshot appetize-results/home.png --json --quiet
          appetize tap --select-text '/^House$/i' --json --quiet
          appetize inspect --select-text 'What do you need cleaned?' --timeout 15000 --json --quiet
          appetize tap --select-text 'House Cleaning' --json --quiet
          appetize tap --select-text '/^Next$/i' --json --quiet
          appetize inspect --select-text 'Specific Room / Part' --timeout 15000 --json --quiet
          appetize screenshot appetize-results/service-selection.png --json --quiet
          appetize tap --select-text 'Specific Room / Part' --json --quiet
          for label in 'Kitchen' 'Under 10 m²'; do
            for attempt in $(seq 1 8); do
              if appetize inspect --select-text "$label" --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
              appetize swipe --direction up --json --quiet
            done
            appetize tap --select-text "$label" --timeout 10000 --json --quiet
          done
          appetize tap --select-text '/^Next$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Details & Condition' --timeout 15000 --json --quiet
          echo 'LIVE_CUSTOMER_CHECKLIST_COMPLETED'
          echo 'LIVE_CUSTOMER_SERVICE_SELECTION_REACHED'
          measure_route 'Activity tab' 'detail:///activity' 'Your bookings'
          measure_route 'Messages tab' 'detail:///messages' 'Messages'
          measure_route 'Wallet tab' 'detail:///wallet' 'Wallet'
          measure_route 'Profile tab' 'detail:///profile' 'Profile'
          echo 'LIVE_CUSTOMER_TABS_RENDERED'
          measure_route 'Service history' 'detail:///history' 'Service History'
          measure_route 'Favorites' 'detail:///favorites' 'Favorites'
          measure_route 'Cleaner search' 'detail:///cleaners' 'Find Cleaners'
          measure_route 'Notifications' 'detail:///notifications' 'Notifications'
          measure_route 'Reviews' 'detail:///reviews' 'My Reviews'
          measure_route 'Help' 'detail:///help' 'Help & Support'
          echo 'LIVE_CUSTOMER_ACCOUNT_ROUTES_RENDERED'
          measure_route 'Support requests' 'detail:///support' 'Support requests'
          measure_route 'Organization' 'detail:///organization' 'Organization'
          measure_route 'Account email' 'detail:///account/email' 'Email address'
          measure_route 'Portfolio' 'detail:///portfolio' 'My portfolio'
          measure_route 'Instant offers' 'detail:///instant-offers' 'Instant offers'
          measure_route 'Announcement detail' 'detail:///announcement?title=QA%20announcement&body=Test%20announcement' 'Announcement'
          measure_route 'Unknown route' 'detail:///route-not-present' 'Screen not found'
          measure_route 'Privacy policy' 'detail:///privacy-policy' 'Privacy Policy'
          measure_route 'Customer agreement' 'detail:///customer-agreement' 'Customer Agreement'
          measure_route 'Cleaner agreement' 'detail:///cleaner-agreement' 'Cleaner Agreement'
          measure_route 'Booking creation' 'detail:///booking/create' 'What do you need cleaned?'
          measure_route 'Booking offers with unknown ID' 'detail:///booking/offers?jobId=00000000-0000-4000-8000-000000000001' 'Bids Received'
          measure_route 'Booking confirmation with unknown ID' 'detail:///booking/confirmation?jobId=00000000-0000-4000-8000-000000000001' 'Booking accepted'
          measure_route 'Job with unknown ID' 'detail:///job/00000000-0000-4000-8000-000000000001' 'Job not found'
          measure_route 'Tracking with unknown ID' 'detail:///tracking/00000000-0000-4000-8000-000000000001' 'Booking unavailable'
          echo 'LIVE_CUSTOMER_ADDITIONAL_ROUTES_RENDERED'
      - name: Verify persisted customer onboarding state
        if: steps.test-users.outcome == 'success'
        run: node scripts/live_mobile_ui_e2e.mjs verify-customer
      - name: Clean up disposable accounts
        if: always()
        run: node scripts/live_mobile_ui_e2e.mjs cleanup
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appetize-live-customer-${{ github.run_id }}
          path: appetize-results/
          if-no-files-found: ignore
          retention-days: 7
