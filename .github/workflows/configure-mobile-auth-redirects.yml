name: Configure mobile authentication redirects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add mobile callback URLs to Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.PROJECT_REF;
          if (!token || ref !== 'yiyhmueospjwbaywzusp') throw new Error('Expected production project or access token is missing.');
          const url = `https://api.supabase.com/v1/projects/${ref}/config/auth`;
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };
          async function request(method, body) {
            const r = await fetch(url, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}) });
            if (!r.ok) throw new Error(`Supabase Auth configuration ${method} failed with HTTP ${r.status}.`);
            return r.json();
          }
          const required = ['detail://reset-password', 'detail://auth/callback'];
          const before = await request('GET');
          if (typeof before.uri_allow_list !== 'string') throw new Error('Unexpected Auth redirect configuration.');
          const existing = before.uri_allow_list.split(',').map(s => s.trim()).filter(Boolean);
          const desired = [...new Set([...existing, ...required])].join(',');
          await request('PATCH', { uri_allow_list: desired });
          const after = await request('GET');
          const saved = new Set(String(after.uri_allow_list).split(',').map(s => s.trim()));
          if (![...existing, ...required].every(value => saved.has(value))) throw new Error('Redirect configuration verification failed.');
          console.log('Mobile recovery and sign-in redirects configured and verified.');
          NODE
