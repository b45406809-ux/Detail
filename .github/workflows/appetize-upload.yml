name: Upload Android APK to Appetize
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub run containing the live-tested APK artifact
        required: false
        type: string
      eas_source_run_id:
        description: GitHub EAS-build workflow run to fetch and upload its APK
        required: false
        type: string
      appetize_target:
        description: Existing Appetize app/build key to inspect without uploading another APK
        required: false
        type: string
  workflow_run:
    workflows:
      - Build Detail Android APK on EAS
    types:
      - completed
    branches:
      - codex/separate-dashboard-into-routed-modules-fl7jlh
permissions:
  actions: read
  contents: read
jobs:
  upload:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Validate source run input
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EAS_SOURCE_RUN_ID: ${{ inputs.eas_source_run_id || github.event.workflow_run.id }}
          APPETIZE_TARGET: ${{ inputs.appetize_target }}
        run: |
          set -euo pipefail
          configured_sources=0
          [[ -z "$SOURCE_RUN_ID" ]] || ((configured_sources+=1))
          [[ -z "$EAS_SOURCE_RUN_ID" ]] || ((configured_sources+=1))
          [[ -z "$APPETIZE_TARGET" ]] || ((configured_sources+=1))
          [[ "$configured_sources" -eq 1 ]] || { echo 'Provide exactly one of source_run_id, eas_source_run_id, or appetize_target.'; exit 1; }

      - name: Wait for the requested APK artifact
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 150); do
            count=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts" --jq ".artifacts | map(select(.name == \"detail-live-tested-apk-$SOURCE_RUN_ID\" and .expired == false)) | length")
            if [[ "$count" -gt 0 ]]; then exit 0; fi
            status=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq .status)
            if [[ "$status" == completed ]]; then echo 'Source run finished without an APK artifact.' >&2; exit 1; fi
            sleep 30
          done
          echo 'Timed out waiting for the APK artifact.' >&2
          exit 1
      - name: Download existing EAS APK artifact
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: detail-live-tested-apk-${{ inputs.source_run_id }}
          path: apk-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ inputs.eas_source_run_id != '' || github.event_name == 'workflow_run' }}
      - name: Set up Node for EAS download
        if: ${{ inputs.eas_source_run_id != '' || github.event_name == 'workflow_run' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app config dependencies
        if: ${{ inputs.eas_source_run_id != '' || github.event_name == 'workflow_run' }}
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: Resolve APK from the EAS source run
        if: ${{ inputs.eas_source_run_id != '' || github.event_name == 'workflow_run' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EAS_SOURCE_RUN_ID: ${{ inputs.eas_source_run_id || github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        working-directory: mobile
        run: |
          set -euo pipefail
          [[ "$EAS_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$EXPO_TOKEN" || { echo 'Missing EXPO_TOKEN for the EAS download.'; exit 1; }
          commit=$(gh api "repos/$REPO/actions/runs/$EAS_SOURCE_RUN_ID" --jq .head_sha)
          npx --yes eas-cli@latest build:list --platform android --build-profile production-apk --git-commit-hash "$commit" --limit 10 --json --non-interactive > "$RUNNER_TEMP/eas-builds.json"
          node <<'NODE'
          const fs = require('node:fs');
          const builds = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/eas-builds.json`, 'utf8'));
          const build = builds.find(item => item.status === 'FINISHED' && (item.artifacts?.buildUrl || item.artifacts?.applicationArchiveUrl));
          const url = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('No completed production APK matches the selected GitHub source commit.');
          fs.appendFileSync(process.env.GITHUB_ENV, `DETAIL_EAS_APK_URL=${url}\n`);
          console.log(`Found the completed APK for EAS build ${build.id}.`);
          NODE

      - name: Download resolved EAS APK
        if: ${{ inputs.eas_source_run_id != '' || github.event_name == 'workflow_run' }}
        run: curl --fail --location --silent --show-error "$DETAIL_EAS_APK_URL" --output "$RUNNER_TEMP/detail-eas-build.apk"

      - name: Find APK
        id: apk
        if: ${{ inputs.appetize_target == '' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            mapfile -t apks < <(find apk-artifact -type f -name '*.apk')
          else
            apks=("$RUNNER_TEMP/detail-eas-build.apk")
          fi
          test "${#apks[@]}" -eq 1
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload APK to Appetize
        if: ${{ inputs.appetize_target == '' }}
        id: upload
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          platform: android
          appFile: ${{ steps.apk.outputs.path }}
          note: Detail APK from GitHub run ${{ inputs.eas_source_run_id || inputs.source_run_id || github.event.workflow_run.id }}
      - name: Record Appetize link
        env:
          APP_KEY: ${{ inputs.appetize_target || steps.upload.outputs.publicKey }}
        run: |
          test -n "$APP_KEY"
          echo "Appetize build: https://appetize.io/app/$APP_KEY" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Appetize agent CLI
        run: npm install --global @appetize/cli@0.25.1 --no-audit --no-fund
      - name: Inspect the app on an Android device
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APP_TARGET: ${{ inputs.appetize_target || steps.upload.outputs.publicKey }}
        run: |
          set -euo pipefail
          mkdir -p appetize-results
          SESSION_ID="detail-${GITHUB_RUN_ID}"
          trap 'appetize session stop --session-id "$SESSION_ID" --json --quiet || true' EXIT
          appetize session start pixel7 --target "$APP_TARGET" --session-id "$SESSION_ID" --no-wait --json --quiet > appetize-results/session.json
          ready=0
          for attempt in $(seq 1 24); do
            if appetize inspect --session-id "$SESSION_ID" --json --quiet > appetize-results/inspect-result.json 2> appetize-results/inspect-error.log; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then
            cat appetize-results/inspect-error.log >&2
            echo 'Appetize device did not become inspectable within two minutes.' >&2
            exit 1
          fi
          appetize screenshot appetize-results/launch --session-id "$SESSION_ID" --json --quiet > appetize-results/screenshot-result.json
      - name: Save Appetize inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appetize-inspection-${{ github.run_id }}
          path: appetize-results/
          if-no-files-found: ignore
          retention-days: 7
