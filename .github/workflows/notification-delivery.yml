name: Detail notification delivery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check worker secrets
        id: config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$CRON_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Set the SUPABASE_URL and CRON_SECRET repository secrets to enable delivery."
          fi
      - name: Process notification deliveries and Expo receipts
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/delivery-worker" \
            --header "x-scheduler-secret: $CRON_SECRET" \
            --header "content-type: application/json" \
            --data '{}'
