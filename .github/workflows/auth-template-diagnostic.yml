name: Diagnose auth email template selection
on:
  push:
    branches: [codex/separate-dashboard-into-routed-modules-fl7jlh]
    paths: [.github/workflows/auth-template-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect template configuration without secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const r = await fetch('https://api.supabase.com/v1/projects/yiyhmueospjwbaywzusp/config/auth', {headers:{authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`}});
            if(!r.ok) throw new Error(`HTTP ${r.status}`);
            const config = await r.json();
            for(const [key,value] of Object.entries(config)) {
              if(key.startsWith('mailer_templates_') && (key.includes('confirmation') || key.includes('magic_link'))) {
                console.log(JSON.stringify({key,empty:!value,usesToken:typeof value==='string' && value.includes('{{ .Token }}'),length:typeof value==='string'?value.length:0}));
              }
            }
            console.log(JSON.stringify({mailer_otp_length:config.mailer_otp_length,hook_send_email_enabled:config.hook_send_email_enabled}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
