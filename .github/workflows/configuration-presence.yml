name: Configuration presence check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/separate-dashboard-into-routed-modules-fl7jlh
    paths:
      - .github/workflows/configuration-presence.yml

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report expected configuration names only
        env:
          CHECK_SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHECK_SECRET_CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CHECK_SECRET_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECK_SECRET_DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          CHECK_SECRET_DIDIT_KYC_SECRET_KEY: ${{ secrets.DIDIT_KYC_SECRET_KEY }}
          CHECK_SECRET_DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          CHECK_SECRET_EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          CHECK_SECRET_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          CHECK_SECRET_EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          CHECK_SECRET_EXPO_PUBLIC_MOCK_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_MOCK_SUPABASE_ANON_KEY }}
          CHECK_SECRET_EXPO_PUBLIC_MOCK_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_MOCK_SUPABASE_URL }}
          CHECK_SECRET_EXPO_PUBLIC_STAGING_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_STAGING_SUPABASE_ANON_KEY }}
          CHECK_SECRET_EXPO_PUBLIC_STAGING_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_STAGING_SUPABASE_URL }}
          CHECK_SECRET_EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CHECK_SECRET_EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          CHECK_SECRET_EXPO_PUBLIC_USE_STAGING_AUTH: ${{ secrets.EXPO_PUBLIC_USE_STAGING_AUTH }}
          CHECK_SECRET_EXPO_RESEND_API_KEY: ${{ secrets.EXPO_RESEND_API_KEY }}
          CHECK_SECRET_FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CHECK_SECRET_FTP_SERVER: ${{ secrets.FTP_SERVER }}
          CHECK_SECRET_FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          CHECK_SECRET_LIVE_E2E_EMAIL_TO: ${{ secrets.LIVE_E2E_EMAIL_TO }}
          CHECK_SECRET_LIVE_E2E_SMS_TO: ${{ secrets.LIVE_E2E_SMS_TO }}
          CHECK_SECRET_MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          CHECK_SECRET_PAYNOW_INTEGRATION_ID: ${{ secrets.PAYNOW_INTEGRATION_ID }}
          CHECK_SECRET_PAYNOW_INTEGRATION_KEY: ${{ secrets.PAYNOW_INTEGRATION_KEY }}
          CHECK_SECRET_PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
          CHECK_SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHECK_SECRET_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHECK_SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHECK_SECRET_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CHECK_SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHECK_SECRET_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CHECK_SECRET_TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          CHECK_SECRET_TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          CHECK_SECRET_TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          CHECK_SECRET_TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          CHECK_SECRET_VITE_DASHBOARD_URL: ${{ secrets.VITE_DASHBOARD_URL }}
          CHECK_SECRET_VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          CHECK_SECRET_VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          CHECK_SECRET_VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          CHECK_SECRET_VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CHECK_SECRET_VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          CHECK_SECRET_VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          CHECK_VARIABLE_APP_RETURN_URL: ${{ vars.APP_RETURN_URL }}
          CHECK_VARIABLE_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHECK_VARIABLE_CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CHECK_VARIABLE_EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          CHECK_VARIABLE_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          CHECK_VARIABLE_EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          CHECK_VARIABLE_EXPO_PUBLIC_MOCK_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_MOCK_SUPABASE_ANON_KEY }}
          CHECK_VARIABLE_EXPO_PUBLIC_MOCK_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_MOCK_SUPABASE_URL }}
          CHECK_VARIABLE_EXPO_PUBLIC_STAGING_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_STAGING_SUPABASE_ANON_KEY }}
          CHECK_VARIABLE_EXPO_PUBLIC_STAGING_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_STAGING_SUPABASE_URL }}
          CHECK_VARIABLE_EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CHECK_VARIABLE_EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          CHECK_VARIABLE_EXPO_PUBLIC_USE_STAGING_AUTH: ${{ vars.EXPO_PUBLIC_USE_STAGING_AUTH }}
          CHECK_VARIABLE_PAYNOW_RETURN_URL: ${{ vars.PAYNOW_RETURN_URL }}
          CHECK_VARIABLE_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CHECK_VARIABLE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CHECK_VARIABLE_VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
          CHECK_VARIABLE_VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          CHECK_VARIABLE_VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          CHECK_VARIABLE_VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          CHECK_VARIABLE_VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          CHECK_VARIABLE_VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          CHECK_VARIABLE_VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rows = ['## Configuration presence (production environment)', '', 'Values are never printed. Environment and repository settings are combined by GitHub.', '', '| Type | Name | Status |', '| --- | --- | --- |'];
          for (const [key, value] of Object.entries(process.env).sort(([a], [b]) => a.localeCompare(b))) {
            const match = /^CHECK_(SECRET|VARIABLE)_(.+)$/.exec(key);
            if (!match) continue;
            rows.push(`| ${match[1]} | ${match[2]} | ${value ? 'SET' : 'MISSING'} |`);
          }
          const output = rows.join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output);
          process.stdout.write(output);
          NODE
