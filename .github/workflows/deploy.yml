name: Build and deploy site and dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-cpanel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site dependencies
        run: npm install --prefix site --no-audit --no-fund

      - name: Require Supabase client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" && test -n "$VITE_TURNSTILE_SITE_KEY"

      - name: Type-check and build production SPA
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Verify Apache routing file is in the artifact
        run: test -f site/dist/.htaccess

      - name: Prepare dashboard-specific link preview
        run: |
          mkdir -p site/dashboard-deploy
          cp -a site/dist/. site/dashboard-deploy/
          cp site/dist/dashboard.html site/dashboard-deploy/index.html

      - name: Deploy main site over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: site/dist/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Deploy dashboard subdomain artifact over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: site/dashboard-deploy/
          server-dir: public_html/dashboard/
          exclude: |
            **/.git*
            **/.git*/**
