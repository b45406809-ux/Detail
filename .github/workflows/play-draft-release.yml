name: Upload Android bundle as a Google Play draft release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android production build workflow run ID.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download the signed Android app bundle
        uses: actions/download-artifact@v4
        with:
          name: detail-android-production-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/detail-android

      - name: Locate Android app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/detail-android" -maxdepth 3 -type f -name '*.aab' -print -quit)"
          if [[ -z "$bundle" ]]; then echo 'No Android app bundle was found in the selected build run.'; exit 1; fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload a draft release to Google Play Production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: zw.co.detailapp.mobile
          releaseFiles: ${{ steps.bundle.outputs.path }}
          tracks: production
          status: draft
