name: Inspect pinned Appetize startup screen

on:
  workflow_dispatch:
    inputs:
      appetize_build_id:
        description: Exact immutable Android Appetize target
        required: true
        type: string
      source_commit:
        description: Full source commit recorded on the Appetize target
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_BUILD_ID: ${{ inputs.appetize_build_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global @appetize/cli@0.25.1 --no-audit --no-fund

      - name: Validate the exact uploaded target
        run: |
          set -euo pipefail
          [[ "$APPETIZE_BUILD_ID" =~ ^[a-z0-9]{20,32}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          appetize build list --app com.detail.app --limit 200 --json --quiet > "$RUNNER_TEMP/appetize-builds.json"
          APPETIZE_BUILD_ID="$APPETIZE_BUILD_ID" SOURCE_COMMIT="$SOURCE_COMMIT" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { builds = [] } = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/appetize-builds.json`, 'utf8'));
          const target = builds.find(build => build.id === process.env.APPETIZE_BUILD_ID);
          if (!target || target.platform !== 'android') throw new Error('The pinned Android target was not found.');
          if (target.note && !String(target.note).includes(process.env.SOURCE_COMMIT)) throw new Error('The target note does not match the supplied source commit.');
          console.log(`PINNED_APPETIZE_TARGET: ${target.id}`);
          console.log(`PINNED_SOURCE_COMMIT: ${process.env.SOURCE_COMMIT}`);
          NODE

      - name: Capture and summarize the cold-start screen
        run: |
          set -euo pipefail
          mkdir -p appetize-results
          session_id="detail-startup-inspection-${GITHUB_RUN_ID}"
          trap 'appetize inspect appetize-results/final.json --session-id "$session_id" --json --quiet || true; appetize screenshot appetize-results/final.png --session-id "$session_id" --json --quiet || true; appetize session stop --session-id "$session_id" --json --quiet || true' EXIT
          appetize session start pixel7 --target "$APPETIZE_BUILD_ID" --session-id "$session_id" --json --quiet > appetize-results/session.json
          appetize inspect appetize-results/startup.json --session-id "$session_id" --json --quiet
          appetize screenshot appetize-results/startup.png --session-id "$session_id" --json --quiet
          node scripts/summarize-appetize-screen.mjs appetize-results/startup.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save startup screenshot and device tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appetize-startup-${{ github.run_id }}
          path: appetize-results/
          if-no-files-found: ignore
          retention-days: 7

