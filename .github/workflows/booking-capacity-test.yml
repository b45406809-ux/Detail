name: Synthetic booking capacity test (local Supabase)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-capacity-local
  cancel-in-progress: false

jobs:
  local-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset --local
      - name: Test 20 concurrent local account registrations
        env:
          RUN_ID: signup_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_ANON_KEY="$ANON_KEY" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/supabase_signup_burst.mjs
      - name: Seed isolated synthetic customers and cleaners
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          case "$DB_URL" in postgresql://postgres:postgres@127.0.0.1:54322/postgres) ;; *) echo 'Refusing to run benchmark outside local Supabase.'; exit 1;; esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/booking_capacity_seed.sql
      - name: Run 10,000 synthetic booking writes through local PostgREST
        env:
          RUN_ID: capacity_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            RUN_ID="$RUN_ID" node scripts/booking_capacity_load.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
