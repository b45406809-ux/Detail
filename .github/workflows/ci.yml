name: Validate Detail

on:
  pull_request:
  push:
    branches:
      - main
      - codex/separate-dashboard-into-routed-modules-fl7jlh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate waitlist migration utility
        run: python -c "compile(open('scripts/migrate_cloudflare_waitlist_to_supabase.py').read(), 'scripts/migrate_cloudflare_waitlist_to_supabase.py', 'exec')"
      - name: Test QA fixture isolation and pool definitions
        run: node --test qa/qa-fixture-pool.test.mjs
      - name: Test provider usage channel reporting helpers
        run: node --test scripts/tests/provider_usage_helpers.test.mjs
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm run build --prefix site
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-key
      - name: Install Chromium for Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Smoke-test public pages and dashboard sign-in screen
        working-directory: site
        run: node scripts/live_dashboard_smoke.mjs
      - name: Verify link preview and routing artifacts
        run: |
          test -f site/dist/index.html
          test -f site/dist/dashboard.html
          test -f site/dist/og-image.png
          test -f site/dist/og-dashboard.png
          test -f site/dist/.htaccess

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund
      - name: Ensure production EAS profile rejects demo mode
        working-directory: mobile
        run: |
          node -e '
            const { spawnSync } = require("node:child_process");
            const config = require("./eas.json");
            if (config.build.production.env.EXPO_PUBLIC_APP_BUILD_PROFILE !== "production") throw new Error("Production EAS profile marker is missing");
            const result = spawnSync(process.execPath, ["app.config.js"], { env: { ...process.env, EAS_BUILD_PROFILE: "production", EXPO_PUBLIC_DEMO_MODE: "true" }, encoding: "utf8" });
            if (result.status === 0 || !result.stderr.includes("Demo mode is prohibited")) throw new Error("Production EAS profile accepted demo mode");
          '
      - name: Test staging EAS backend isolation
        run: node --test qa/staging-build-config.test.mjs
      - name: Ensure Mapbox download secret stays out of public Expo config
        working-directory: mobile
        env:
          MAPBOX_DOWNLOADS_TOKEN: private-mapbox-canary-do-not-publish
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.public-mapbox-canary
        run: |
          ./node_modules/.bin/expo config --type public --json | node -e '
            let output = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => output += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(output);
              if (JSON.stringify(config).includes(process.env.MAPBOX_DOWNLOADS_TOKEN)) {
                throw new Error("Mapbox downloads secret leaked into public Expo config");
              }
              if (!JSON.stringify(config).includes(process.env.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN)) {
                throw new Error("Public Mapbox styles token is missing from Expo config");
              }
            });
          '
      - run: npm run type-check --prefix mobile
      - name: Test Google ID token nonce handling
        run: node --test mobile/scripts/google_id_token_nonce.test.mjs
      - name: Test deferred account media handling
        run: node --experimental-strip-types --test qa/deferred-profile-media.test.mjs
      - run: npm run lint --prefix mobile

  functions:
    name: Legacy migration utilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Validate status-only live provider test runner
        run: node --check scripts/live_provider_checks.mjs
      - name: Validate Firebase cutover importer syntax
        run: node --check functions/scripts/migrate-firebase-to-supabase.mjs
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm run build --prefix functions

  supabase:
    name: Supabase migrations and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset --local
      - name: Run database security invariant tests
        run: supabase test db --local
      - name: Lint local database schema
        run: supabase db lint --local --schema public --fail-on error
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Test Supabase session authentication checks
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/*_test.ts
      - name: Create and verify the synthetic QA fixture pool
        env:
          QA_RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/run_local_qa_fixture_pool.mjs create
      - name: Install dashboard browser test dependencies
        run: |
          npm ci --prefix site --no-audit --no-fund
          (cd site && npx playwright install --with-deps chromium)
      - name: Build dashboard against the isolated local Supabase backend
        run: VITE_SUPABASE_URL="$SUPABASE_TEST_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_TEST_ANON_KEY" npm run build --prefix site
      - name: Run authenticated dashboard journeys against synthetic local fixtures
        env:
          QA_RUN_ID: ${{ github.run_id }}
          LOCAL_DASHBOARD_URL: http://localhost:4173
        run: |
          set -euo pipefail
          npm run preview --prefix site -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/detail-dashboard-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4173/admin >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4173/admin >/dev/null
          node site/scripts/local_dashboard_qa.mjs
      - name: Clean up local QA fixture pool
        if: always()
        env:
          QA_RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/run_local_qa_fixture_pool.mjs cleanup
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Save redacted fixture cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-fixture-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/detail-qa-fixtures-${{ github.run_id }}-cleanup.json
          if-no-files-found: ignore
          retention-days: 3
