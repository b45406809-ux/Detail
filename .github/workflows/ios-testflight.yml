name: iOS TestFlight operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check inputs, start a build, inspect a build, or submit it to TestFlight
        required: true
        type: choice
        options: [readiness, build, inspect, submit, asc-check]
      build_id:
        description: Completed EAS iOS production build ID (required for submit)
        required: false
        type: string
      signing_run_id:
        description: GitHub run ID that created the Apple signing artifact (required for build)
        required: false
        type: string
      confirm_testflight_submission:
        description: Confirm submission to App Store Connect TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN || secrets.EAS_BOT_TOKEN_2 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_BUILD_ID: ${{ inputs.build_id }}
      SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
      CONFIRM_SUBMISSION: ${{ inputs.confirm_testflight_submission }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID EXPO_APPLE_TEAM_TYPE; do
            if [[ -z "${!name}" ]]; then
              echo "$name is missing from the production environment."
              exit 1
            fi
          done
          case "$EXPO_APPLE_TEAM_TYPE" in
            IN_HOUSE|COMPANY_OR_ORGANIZATION|INDIVIDUAL) ;;
            *) echo 'EXPO_APPLE_TEAM_TYPE must be IN_HOUSE, COMPANY_OR_ORGANIZATION, or INDIVIDUAL.'; exit 1 ;;
          esac
          if [[ -z "$ASC_API_KEY_P8" ]]; then
            echo 'EXPO_ASC_API_KEY_P8 is missing from the production environment.'
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          echo "EXPO_ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo 'App Store Connect API key and Apple team settings are present.'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check GitHub input presence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPO_TOKEN" ]]; then echo 'Expo token: present'; else echo 'Expo token: missing'; exit 1; fi
          if [[ -n "$GOOGLE_WEB_CLIENT_ID" ]]; then echo 'Google Web client ID: present in GitHub'; else echo 'Google Web client ID: missing in GitHub'; fi
          if [[ -n "$GOOGLE_IOS_CLIENT_ID" ]]; then echo 'Google iOS client ID: present in GitHub'; else echo 'Google iOS client ID: missing in GitHub'; fi
          if [[ -n "$APPLE_CLIENT_SECRET" ]]; then echo 'Apple account deletion client secret: present in GitHub'; else echo 'Apple account deletion client secret: missing in GitHub'; fi
          echo 'This check does not verify EAS environment variables, Apple credentials, or Supabase provider configuration.'
          if [[ "$REQUESTED_OPERATION" == submit || "$REQUESTED_OPERATION" == inspect ]]; then
            [[ "$REQUESTED_BUILD_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo 'Enter a valid EAS build UUID.'; exit 1; }
          fi
          if [[ "$REQUESTED_OPERATION" == build ]]; then
            [[ "${SIGNING_RUN_ID:-}" =~ ^[0-9]+$ ]] || { echo 'Enter the GitHub run ID that created the iOS signing artifact.'; exit 1; }
          fi
          if [[ "$REQUESTED_OPERATION" == submit ]]; then
            [[ "$CONFIRM_SUBMISSION" == true ]] || { echo 'Submission confirmation is required.'; exit 1; }
          fi
      - name: Install dependencies
        run: npm ci --prefix mobile --no-audit --no-fund
      - name: Check mobile types
        run: npm run type-check --prefix mobile
      - name: Download Apple signing artifact
        if: inputs.operation == 'build'
        uses: actions/download-artifact@v4
        with:
          name: detail-ios-signing-${{ inputs.signing_run_id }}
          path: ${{ runner.temp }}/detail-ios-signing
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run_id }}
      - name: Repackage signing certificate for macOS and configure local EAS credentials
        if: inputs.operation == 'build'
        shell: bash
        env:
          SIGNING_DIR: ${{ runner.temp }}/detail-ios-signing
        run: |
          set -euo pipefail
          openssl pkcs12 -provider default -provider legacy -in "$SIGNING_DIR/distribution.p12" -passin "file:$SIGNING_DIR/p12-password.txt" -nocerts -nodes -out "$SIGNING_DIR/distribution-key.pem"
          openssl pkcs12 -provider default -provider legacy -in "$SIGNING_DIR/distribution.p12" -passin "file:$SIGNING_DIR/p12-password.txt" -clcerts -nokeys -out "$SIGNING_DIR/distribution-cert.pem"
          openssl pkcs12 -export -provider default -provider legacy -inkey "$SIGNING_DIR/distribution-key.pem" -in "$SIGNING_DIR/distribution-cert.pem" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -iter 2048 \
            -out "$SIGNING_DIR/distribution-macos.p12" -passout "file:$SIGNING_DIR/p12-password.txt"
          openssl pkcs12 -in "$SIGNING_DIR/distribution-macos.p12" -passin "file:$SIGNING_DIR/p12-password.txt" -noout
          mkdir -p mobile/.eas/credentials
          cp "$SIGNING_DIR/distribution-macos.p12" mobile/.eas/credentials/distribution.p12
          cp "$SIGNING_DIR/profile.mobileprovision" mobile/.eas/credentials/profile.mobileprovision
          node -e 'const fs=require("node:fs"); const password=fs.readFileSync(process.env.SIGNING_DIR+"/p12-password.txt","utf8").trim(); fs.writeFileSync("mobile/credentials.json", JSON.stringify({ios:{provisioningProfilePath:".eas/credentials/profile.mobileprovision",distributionCertificate:{path:".eas/credentials/distribution.p12",password}}},null,2));'
      - name: Start signed iOS production build on EAS
        if: inputs.operation == 'build'
        working-directory: mobile
        run: npx --yes eas-cli@16.28.0 build --platform ios --profile production-github --non-interactive --no-wait
      - name: Inspect selected EAS build
        if: inputs.operation == 'inspect'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@16.28.0 build:view "$REQUESTED_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          node -e 'const b=require(process.env.RUNNER_TEMP+"/eas-build.json"); console.log(JSON.stringify({id:b.id,status:b.status,profile:b.buildProfile,sdkVersion:b.sdkVersion,error:b.error,logFiles:b.logFiles,artifacts:b.artifacts},null,2))'
      - name: Wait for selected EAS build to finish
        if: inputs.operation == 'submit'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            build_json="$(npx --yes eas-cli@16.28.0 build:view "$REQUESTED_BUILD_ID" --json)"
            build_status="$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const b=JSON.parse(s);process.stdout.write(String(b.status ?? "unknown").toLowerCase())})')"
            case "$build_status" in
              finished)
                echo 'The EAS iOS build finished successfully.'
                exit 0
                ;;
              errored|canceled)
                echo "The EAS iOS build ended with status: $build_status"
                exit 1
                ;;
              *)
                echo "EAS build status: $build_status; checking again in 30 seconds."
                sleep 30
                ;;
            esac
          done
          echo 'The EAS build did not finish within 30 minutes.'
          exit 1
      - name: Resolve App Store Connect app ID
        if: inputs.operation == 'submit'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const keyId = process.env.EXPO_ASC_KEY_ID;
          const issuerId = process.env.EXPO_ASC_ISSUER_ID;
          const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
          const bundleId = 'zw.co.detailapp.mobile';
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const signingInput = `${encode({ alg: 'ES256', kid: keyId, typ: 'JWT' })}.${encode({ iss: issuerId, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' })}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${signingInput}.${signature}`;
          (async () => {
            const response = await fetch(`https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=${encodeURIComponent(bundleId)}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const body = await response.json();
            if (!response.ok) throw new Error(`App Store Connect app lookup failed (${response.status}): ${JSON.stringify(body.errors ?? body)}`);
            if (body.data?.length !== 1) {
              const allResponse = await fetch('https://api.appstoreconnect.apple.com/v1/apps?limit=200', {
                headers: { Authorization: `Bearer ${token}` },
              });
              const allApps = await allResponse.json();
              if (!allResponse.ok) throw new Error(`App Store Connect app listing failed (${allResponse.status}): ${JSON.stringify(allApps.errors ?? allApps)}`);
              console.log(`No app record matches ${bundleId}. Apps visible to this API key: ${JSON.stringify((allApps.data ?? []).map(({ id, attributes }) => ({ id, name: attributes.name, bundleId: attributes.bundleId })))}`);
              throw new Error(`Expected one App Store Connect app for ${bundleId}, found ${body.data?.length ?? 0}. Create the app record in App Store Connect, then rerun submission.`);
            }
            const configPath = 'eas.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            config.submit ??= {};
            config.submit.production ??= {};
            config.submit.production.ios ??= {};
            config.submit.production.ios.ascAppId = body.data[0].id;
            config.submit.production.ios.ascApiKeyId = keyId;
            config.submit.production.ios.ascApiKeyIssuerId = issuerId;
            config.submit.production.ios.ascApiKeyPath = process.env.EXPO_ASC_API_KEY_PATH;
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
            console.log(`Resolved the App Store Connect app for ${bundleId}.`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Submit selected build to TestFlight
        if: inputs.operation == 'submit'
        working-directory: mobile
        run: npx --yes eas-cli@16.28.0 submit --platform ios --profile production --id "$REQUESTED_BUILD_ID" --non-interactive --no-wait
      - name: Check App Store Connect build processing
        if: inputs.operation == 'asc-check'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const keyId = process.env.EXPO_ASC_KEY_ID;
          const issuerId = process.env.EXPO_ASC_ISSUER_ID;
          const key = fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH);
          const bundleId = 'zw.co.detailapp.mobile';
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const signingInput = `${encode({ alg: 'ES256', kid: keyId, typ: 'JWT' })}.${encode({ iss: issuerId, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' })}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${signingInput}.${signature}`;
          const request = async (url) => {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const body = await response.json();
            if (!response.ok) throw new Error(`App Store Connect request failed (${response.status}): ${JSON.stringify(body.errors ?? body)}`);
            return body;
          };
          (async () => {
            const apps = await request(`https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=${encodeURIComponent(bundleId)}`);
            if (apps.data?.length !== 1) throw new Error(`Expected one App Store Connect app for ${bundleId}, found ${apps.data?.length ?? 0}.`);
            const appId = apps.data[0].id;
            const builds = await request(`https://api.appstoreconnect.apple.com/v1/builds?filter[app]=${encodeURIComponent(appId)}&sort=-uploadedDate&limit=20`);
            const result = (builds.data ?? []).map(({ id, attributes }) => ({
              buildId: id,
              version: attributes.version,
              uploadedDate: attributes.uploadedDate,
              processingState: attributes.processingState,
              expirationDate: attributes.expirationDate,
              expired: attributes.expired,
            }));
            console.log(JSON.stringify({ appName: apps.data[0].attributes.name, bundleId, builds: result }, null, 2));
            if (result.length === 0) console.log('Apple has not listed any uploaded builds for this app yet.');
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Remove local signing material
        if: always()
        shell: bash
        run: |
          rm -f mobile/credentials.json mobile/.eas/credentials/distribution.p12 mobile/.eas/credentials/profile.mobileprovision
          rm -rf "$RUNNER_TEMP/detail-ios-signing"
