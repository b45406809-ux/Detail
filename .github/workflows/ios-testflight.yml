name: iOS TestFlight operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check inputs, start a build, inspect a build, or submit it to TestFlight
        required: true
        type: choice
        options: [readiness, build, inspect, submit]
      build_id:
        description: Completed EAS iOS production build ID (required for submit)
        required: false
        type: string
      confirm_testflight_submission:
        description: Confirm submission to App Store Connect TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN || secrets.EAS_BOT_TOKEN_2 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_BUILD_ID: ${{ inputs.build_id }}
      CONFIRM_SUBMISSION: ${{ inputs.confirm_testflight_submission }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID EXPO_APPLE_TEAM_TYPE; do
            if [[ -z "${!name}" ]]; then
              echo "$name is missing from the production environment."
              exit 1
            fi
          done
          case "$EXPO_APPLE_TEAM_TYPE" in
            IN_HOUSE|COMPANY_OR_ORGANIZATION|INDIVIDUAL) ;;
            *) echo 'EXPO_APPLE_TEAM_TYPE must be IN_HOUSE, COMPANY_OR_ORGANIZATION, or INDIVIDUAL.'; exit 1 ;;
          esac
          if [[ -z "$ASC_API_KEY_P8" ]]; then
            echo 'EXPO_ASC_API_KEY_P8 is missing from the production environment.'
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          echo "EXPO_ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo 'App Store Connect API key and Apple team settings are present.'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check GitHub input presence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPO_TOKEN" ]]; then echo 'Expo token: present'; else echo 'Expo token: missing'; exit 1; fi
          if [[ -n "$GOOGLE_WEB_CLIENT_ID" ]]; then echo 'Google Web client ID: present in GitHub'; else echo 'Google Web client ID: missing in GitHub'; fi
          if [[ -n "$GOOGLE_IOS_CLIENT_ID" ]]; then echo 'Google iOS client ID: present in GitHub'; else echo 'Google iOS client ID: missing in GitHub'; fi
          if [[ -n "$APPLE_CLIENT_SECRET" ]]; then echo 'Apple account deletion client secret: present in GitHub'; else echo 'Apple account deletion client secret: missing in GitHub'; fi
          echo 'This check does not verify EAS environment variables, Apple credentials, or Supabase provider configuration.'
          if [[ "$REQUESTED_OPERATION" == submit || "$REQUESTED_OPERATION" == inspect ]]; then
            [[ "$REQUESTED_BUILD_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo 'Enter a valid EAS build UUID.'; exit 1; }
          fi
          if [[ "$REQUESTED_OPERATION" == submit ]]; then
            [[ "$CONFIRM_SUBMISSION" == true ]] || { echo 'Submission confirmation is required.'; exit 1; }
          fi
      - name: Install dependencies
        run: npm ci --prefix mobile --no-audit --no-fund
      - name: Check mobile types
        run: npm run type-check --prefix mobile
      - name: Start signed iOS production build on EAS
        if: inputs.operation == 'build'
        working-directory: mobile
        run: npx --yes eas-cli@16.28.0 build --platform ios --profile production --non-interactive --no-wait
      - name: Inspect selected EAS build
        if: inputs.operation == 'inspect'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@16.28.0 build:view "$REQUESTED_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          node -e 'const b=require(process.env.RUNNER_TEMP+"/eas-build.json"); console.log(JSON.stringify({id:b.id,status:b.status,profile:b.buildProfile,sdkVersion:b.sdkVersion,error:b.error,logFiles:b.logFiles,artifacts:b.artifacts},null,2))'
      - name: Wait for selected EAS build to finish
        if: inputs.operation == 'submit'
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            build_json="$(npx --yes eas-cli@16.28.0 build:view "$REQUESTED_BUILD_ID" --json)"
            build_status="$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const b=JSON.parse(s);process.stdout.write(String(b.status ?? "unknown").toLowerCase())})')"
            case "$build_status" in
              finished)
                echo 'The EAS iOS build finished successfully.'
                exit 0
                ;;
              errored|canceled)
                echo "The EAS iOS build ended with status: $build_status"
                exit 1
                ;;
              *)
                echo "EAS build status: $build_status; checking again in 30 seconds."
                sleep 30
                ;;
            esac
          done
          echo 'The EAS build did not finish within 30 minutes.'
          exit 1
      - name: Submit selected build to TestFlight
        if: inputs.operation == 'submit'
        working-directory: mobile
        run: npx --yes eas-cli@16.28.0 submit --platform ios --profile production --id "$REQUESTED_BUILD_ID" --non-interactive --no-wait
