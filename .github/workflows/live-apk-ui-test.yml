name: Live Android APK UI test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-apk-ui-test
  cancel-in-progress: false

jobs:
  android-live-ui:
    name: Build APK and test client/cleaner journeys
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate live test credentials and closed-booking safety gate
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$MAPBOX_DOWNLOADS_TOKEN"
          test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          node scripts/live_mobile_ui_e2e.mjs preflight

      - run: npm ci --prefix mobile --no-audit --no-fund

      - name: Set Mapbox tokens in EAS production environment
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest env:set production --scope project --name MAPBOX_DOWNLOADS_TOKEN --value "$MAPBOX_DOWNLOADS_TOKEN" --visibility secret --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN --value "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" --visibility plaintext --non-interactive

      - name: Build APK from this branch on EAS
        id: build
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform android --profile production-apk --non-interactive --wait --json > "$RUNNER_TEMP/detail-live-apk-build.json"
          node <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/detail-live-apk-build.json`, 'utf8'));
          const build = Array.isArray(parsed) ? parsed.at(-1) : parsed;
          const artifact = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
          if (!artifact) throw new Error('EAS completed without an APK artifact URL.');
          fs.appendFileSync(process.env.GITHUB_ENV, `DETAIL_LIVE_APK_URL=${artifact}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Live Android UI test\n\n- EAS build: ${build.id}\n- The APK was built from this workflow's branch and tested on an Android emulator against live Supabase.\n`);
          NODE

      - name: Download the EAS APK
        run: curl --fail --location --silent --show-error "$DETAIL_LIVE_APK_URL" --output "$RUNNER_TEMP/detail-live-test.apk"

      - name: Create disposable live Supabase test accounts
        id: test-users
        run: node scripts/live_mobile_ui_e2e.mjs create

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install APK and run Android client and cleaner journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install "$RUNNER_TEMP/detail-live-test.apk"
            install_status=$?
            if [[ $install_status -ne 0 ]]; then exit $install_status; fi
            maestro test --env CUSTOMER_EMAIL="$E2E_CUSTOMER_EMAIL" --env CUSTOMER_PASSWORD="$E2E_CUSTOMER_PASSWORD" .maestro/live-client-booking-gate.yaml
            client_status=$?
            maestro test --env CLEANER_EMAIL="$E2E_CLEANER_EMAIL" --env CLEANER_PASSWORD="$E2E_CLEANER_PASSWORD" .maestro/live-cleaner-verification-gate.yaml
            cleaner_status=$?
            if [[ $client_status -ne 0 || $cleaner_status -ne 0 ]]; then exit 1; fi

      - name: Clean up live Supabase test accounts
        if: always()
        run: node scripts/live_mobile_ui_e2e.mjs cleanup

      - name: Upload tested APK and EAS build record
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: detail-live-tested-apk-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/detail-live-test.apk
            ${{ runner.temp }}/detail-live-apk-build.json
          if-no-files-found: warn
          retention-days: 7
