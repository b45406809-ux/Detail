name: Live Android APK UI test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional prior live UI run containing the APK; leave blank to build a new APK.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: live-apk-ui-test
  cancel-in-progress: false

jobs:
  android-live-ui:
    name: Build APK and test client/cleaner journeys
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Android emulator acceleration
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo 'Android hardware acceleration is unavailable on this runner; stopping before starting an EAS build.' >&2
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate live test credentials and closed-booking safety gate
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$MAPBOX_DOWNLOADS_TOKEN"
          test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          node scripts/live_mobile_ui_e2e.mjs preflight

      - run: npm ci --prefix mobile --no-audit --no-fund
        if: ${{ inputs.source_run_id == '' }}

      - name: Set Mapbox tokens in EAS production environment
        if: ${{ inputs.source_run_id == '' }}
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest env:set production --scope project --name MAPBOX_DOWNLOADS_TOKEN --value "$MAPBOX_DOWNLOADS_TOKEN" --visibility secret --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN --value "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" --visibility plaintext --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --visibility plaintext --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$EXPO_PUBLIC_SUPABASE_ANON_KEY" --visibility plaintext --non-interactive
          if [[ -n "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" --visibility plaintext --non-interactive
          fi
          if [[ -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" --visibility plaintext --non-interactive
          fi
          if [[ -n "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]]; then
            npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID --value "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" --visibility plaintext --non-interactive
          fi

      - name: Build APK from this branch on EAS
        id: build
        if: ${{ inputs.source_run_id == '' }}
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform android --profile production-apk --non-interactive --wait --json > "$RUNNER_TEMP/detail-live-apk-build.json"
          node <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/detail-live-apk-build.json`, 'utf8'));
          const build = Array.isArray(parsed) ? parsed.at(-1) : parsed;
          const artifact = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
          if (!artifact) throw new Error('EAS completed without an APK artifact URL.');
          fs.appendFileSync(process.env.GITHUB_ENV, `DETAIL_LIVE_APK_URL=${artifact}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Live Android UI test\n\n- EAS build: ${build.id}\n- The APK was built from this workflow's branch and tested on an Android emulator against live Supabase.\n`);
          NODE

      - name: Download the EAS APK
        if: ${{ inputs.source_run_id == '' }}
        run: curl --fail --location --silent --show-error "$DETAIL_LIVE_APK_URL" --output "$RUNNER_TEMP/detail-live-test.apk"

      - name: Publish EAS APK for Appetize and manual testing
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: detail-live-tested-apk-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/detail-live-test.apk
            ${{ runner.temp }}/detail-live-apk-build.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate the source run for an existing APK
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_branch)
          [[ "$branch" == 'codex/separate-dashboard-into-routed-modules-fl7jlh' ]]
          echo "Testing the APK from run ${SOURCE_RUN_ID}." >> "$GITHUB_STEP_SUMMARY"

      - name: Download the existing APK
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: detail-live-tested-apk-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/reused-apk
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Prepare the existing APK
        if: ${{ inputs.source_run_id != '' }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/reused-apk/detail-live-test.apk" "$RUNNER_TEMP/detail-live-test.apk"

      - name: Create disposable live Supabase test accounts
        id: test-users
        run: node scripts/live_mobile_ui_e2e.mjs create

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install APK and run Android client and cleaner journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep the AVD's userdata partition below the available runner disk.
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/run-live-android-ui.sh

      - name: Clean up live Supabase test accounts
        if: always()
        run: node scripts/live_mobile_ui_e2e.mjs cleanup
