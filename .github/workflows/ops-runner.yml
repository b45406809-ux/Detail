name: Detail allowlisted GitHub operations

on:
  push:
    branches:
      - main
      - codex/separate-dashboard-into-routed-modules-fl7jlh
    paths:
      - cmd.txt
  workflow_dispatch:
    inputs:
      task:
        description: Select a fixed operation; arbitrary shell commands are not accepted.
        type: choice
        required: true
        options:
          - site-checks
          - mobile-checks
          - mobile-export-checks
          - functions-checks
          - supabase-local-checks
          - full-checks
          - supabase-migration-list
          - supabase-migration-dry-run
          - waitlist-migration-dry-run
          - live-readiness
          - live-core-readiness
          - live-paynow-e2e
          - live-didit-e2e
          - live-email-e2e
          - live-sms-e2e
          - live-provider-e2e
          - deploy-sms-hook
          - push-config-readiness
          - play-internal-bundle
          - play-internal-release
      android_version_code:
        description: Unused Google Play Android version code for the internal test bundle.
        required: false
        type: string
      confirm_production_access:
        description: Required for read-only access to production Supabase or Cloudflare data.
        type: boolean
        required: true
        default: false
      confirm_live_access:
        description: Required before live provider readiness requests are made.
        type: boolean
        required: true
        default: false
      confirm_live_side_effects:
        description: Required for payment, KYC, email, and SMS test operations that create live provider records or send messages.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: detail-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  play-internal-bundle:
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'play-internal-bundle' || inputs.task == 'play-internal-release') && inputs.confirm_live_access == true && github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CI: '1'
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_APP_BUILD_PROFILE: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN || secrets.EAS_BOT_TOKEN_2 }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      FIREBASE_ANDROID_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      DETAIL_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check release inputs and prepare Firebase config
        env:
          PLAY_RELEASE_REQUESTED: ${{ inputs.task == 'play-internal-release' }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [[ "$DETAIL_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo 'Supply an unused Play version code.'; exit 1; }
          test -n "$EXPO_TOKEN" && test -n "$FIREBASE_ANDROID_JSON" && test -n "$MAPBOX_DOWNLOADS_TOKEN" && test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" && test -n "$EXPO_PUBLIC_SUPABASE_URL" && test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ "$PLAY_RELEASE_REQUESTED" = 'true' ]; then test -n "$PLAY_SERVICE_ACCOUNT" || { echo 'Google Play service account is not configured.'; exit 1; }; fi
          node <<'NODE'
          const fs = require('fs');
          const value = process.env.FIREBASE_ANDROID_JSON;
          const json = value.trim().startsWith('{') ? value : Buffer.from(value, 'base64').toString('utf8');
          const config = JSON.parse(json);
          if (!config.client?.some(client => client.client_info?.android_client_info?.package_name === 'com.detail.app')) throw new Error('Firebase configuration does not match com.detail.app.');
          const file = `${process.env.RUNNER_TEMP}/detail-google-services.json`;
          fs.writeFileSync(file, json, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_SERVICES_JSON=${file}\n`);
          console.log('Android Firebase config is ready.');
          NODE
      - name: Prepare the existing signing key
        run: node scripts/prepare-play-signing.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1'
      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure signing for the Play bundle
        working-directory: mobile/android/app
        run: |
          cat >> build.gradle <<'GRADLE'
          def detailSigning = new groovy.json.JsonSlurper().parse(new File(System.getenv('RUNNER_TEMP'), 'detail-play-signing/signing.json'))
          android {
            signingConfigs {
              detailPlay {
                storeFile file(new File(System.getenv('RUNNER_TEMP'), 'detail-play-signing/upload.jks'))
                storePassword detailSigning.storePassword
                keyAlias detailSigning.keyAlias
                keyPassword detailSigning.keyPassword
              }
            }
            buildTypes { release { signingConfig signingConfigs.detailPlay } }
          }
          GRADLE
      - name: Build signed Android App Bundle on GitHub
        working-directory: mobile/android
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" bundleRelease
      - name: Verify bundle signature
        run: jarsigner -verify mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Save Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: detail-play-internal-${{ github.sha }}-${{ inputs.android_version_code }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Upload to Play internal testing
        if: inputs.task == 'play-internal-release'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.detail.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Remove temporary signing credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/detail-play-signing" "$RUNNER_TEMP/detail-google-services.json"
  push-config-readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'push-config-readiness' && inputs.confirm_live_access == true && github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN || secrets.EAS_BOT_TOKEN_2 }}
      GITHUB_FIREBASE_FILE: ${{ secrets.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Expo and Firebase configuration without printing values
        working-directory: mobile
        run: |
          set -euo pipefail
          node -e 'console.log(`GITHUB_ANDROID_FIREBASE_CONFIG: ${process.env.GITHUB_FIREBASE_FILE ? "present" : "not configured"}`)'
          if [ -z "$EXPO_TOKEN" ]; then echo 'EXPO_ACCESS: unavailable'; exit 1; fi
          node <<'NODE'
          (async () => {
            const query = 'query { app { byFullName(fullName: "@detail-test/detail") { androidAppCredentials(filter: { applicationIdentifier: "com.detail.app" }) { googleServiceAccountKeyForFcmV1 { id } googleServiceAccountKeyForSubmissions { id } androidAppBuildCredentialsList { isDefault androidKeystore { id } } } } } }';
            const response = await fetch('https://api.expo.dev/graphql', { method: 'POST', headers: { authorization: `Bearer ${process.env.EXPO_TOKEN}`, 'content-type': 'application/json' }, body: JSON.stringify({ query }) });
            if (!response.ok) { console.log(`EXPO_CREDENTIAL_QUERY: HTTP ${response.status}`); process.exitCode = 1; return; }
            const data = await response.json();
            if (data.errors) { console.log('EXPO_CREDENTIAL_QUERY: unavailable'); process.exitCode = 1; return; }
            const credentials = data.data?.app?.byFullName?.androidAppCredentials;
            console.log(`EXPO_FCM_V1_CREDENTIAL: ${Array.isArray(credentials) && credentials.some(item => item.googleServiceAccountKeyForFcmV1) ? 'present' : 'not configured'}`);
            console.log(`EXPO_PLAY_SUBMISSION_CREDENTIAL: ${Array.isArray(credentials) && credentials.some(item => item.googleServiceAccountKeyForSubmissions) ? 'present' : 'not configured'}`);
            console.log(`EXPO_ANDROID_SIGNING_KEY: ${Array.isArray(credentials) && credentials.some(item => item.androidAppBuildCredentialsList?.some(build => build.isDefault && build.androidKeystore)) ? 'present' : 'not configured'}`);
            const envQuery = 'query { app { byId(appId: "560c0183-2f37-4d7a-8e4f-59b9b0bf9e85") { environmentVariables(filterNames: ["GOOGLE_SERVICES_JSON"], environment: PRODUCTION) { name } } } }';
            const envResponse = await fetch('https://api.expo.dev/graphql', { method: 'POST', headers: { authorization: `Bearer ${process.env.EXPO_TOKEN}`, 'content-type': 'application/json' }, body: JSON.stringify({ query: envQuery }) });
            const envData = await envResponse.json();
            if (!envResponse.ok || envData.errors) console.log('EAS_ANDROID_FIREBASE_VARIABLE: query unavailable');
            else console.log(`EAS_ANDROID_FIREBASE_VARIABLE: ${envData.data?.app?.byId?.environmentVariables?.some(item => item.name === 'GOOGLE_SERVICES_JSON') ? 'present' : 'not found'}`);
          })().catch(() => { console.log('EXPO_CREDENTIAL_QUERY: failed'); process.exitCode = 1; });
          NODE
  deploy-sms-hook:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'deploy-sms-hook' && inputs.confirm_live_access == true && github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check SMS hook
        run: |
          deno test supabase/functions/_shared/smspop_test.ts
          deno check --config supabase/functions/deno.json supabase/functions/auth-sms-smspop/index.ts
      - name: Deploy only the SMS hook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = yiyhmueospjwbaywzusp
          npx --yes supabase@latest functions deploy auth-sms-smspop --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
  checks:
    if: github.event_name == 'push' || inputs.task == 'site-checks' || inputs.task == 'mobile-checks' || inputs.task == 'mobile-export-checks' || inputs.task == 'functions-checks' || inputs.task == 'supabase-local-checks' || inputs.task == 'full-checks'
    name: Run selected local checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPS_LOG: ${{ github.workspace }}/detail-ops.log
    steps:
      - uses: actions/checkout@v4

      - name: Select local operation
        id: select
        env:
          INPUT_TASK: ${{ inputs.task }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            task="$(tr -d '\r\n' < cmd.txt)"
          else
            task="$INPUT_TASK"
          fi
          case "$task" in
            site-checks|mobile-checks|mobile-export-checks|functions-checks|supabase-local-checks|full-checks) ;;
            *) echo "cmd.txt accepts only a named local check from the workflow task menu." >&2; exit 2 ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"
          printf 'Selected operation: %s\n' "$task" > "$OPS_LOG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Site and dashboard checks
        if: steps.select.outputs.task == 'site-checks' || steps.select.outputs.task == 'full-checks'
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-key
        run: |
          set -euo pipefail
          if npm ci --prefix site --no-audit --no-fund >> "$OPS_LOG" 2>&1 && npm run build --prefix site >> "$OPS_LOG" 2>&1; then
            echo 'Site build passed.' >> "$OPS_LOG"
          else
            code=$?; echo "Site checks failed (exit $code)." >> "$OPS_LOG"; exit "$code"
          fi

      - name: Mobile type-check and lint
        if: steps.select.outputs.task == 'mobile-checks' || steps.select.outputs.task == 'full-checks'
        run: |
          set -euo pipefail
          if npm ci --prefix mobile --no-audit --no-fund >> "$OPS_LOG" 2>&1 && npm run type-check --prefix mobile >> "$OPS_LOG" 2>&1 && npm run lint --prefix mobile >> "$OPS_LOG" 2>&1; then
            echo 'Mobile type-check and lint passed.' >> "$OPS_LOG"
          else
            code=$?; echo "Mobile checks failed (exit $code)." >> "$OPS_LOG"; exit "$code"
          fi

      - name: Export mobile app bundle
        if: steps.select.outputs.task == 'mobile-export-checks' || steps.select.outputs.task == 'full-checks'
        env:
          TASK: ${{ steps.select.outputs.task }}
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.ci-placeholder-token
        run: |
          set -euo pipefail
          if [[ "$TASK" == 'full-checks' ]] || npm ci --prefix mobile --no-audit --no-fund >> "$OPS_LOG" 2>&1; then
            if (cd mobile && npx expo export --platform ios --output-dir "$RUNNER_TEMP/detail-mobile-export/ios" && npx expo export --platform android --output-dir "$RUNNER_TEMP/detail-mobile-export/android") >> "$OPS_LOG" 2>&1; then
              echo 'iOS and Android app exports passed.' >> "$OPS_LOG"
            else
              code=$?; echo "Mobile export failed (exit $code)." >> "$OPS_LOG"; exit "$code"
            fi
          else
            code=$?; echo "Mobile export dependency install failed (exit $code)." >> "$OPS_LOG"; exit "$code"
          fi

      - name: Legacy functions build
        if: steps.select.outputs.task == 'functions-checks' || steps.select.outputs.task == 'full-checks'
        run: |
          set -euo pipefail
          if npm ci --prefix functions --no-audit --no-fund >> "$OPS_LOG" 2>&1 && npm run build --prefix functions >> "$OPS_LOG" 2>&1; then
            echo 'Functions build passed.' >> "$OPS_LOG"
          else
            code=$?; echo "Functions build failed (exit $code)." >> "$OPS_LOG"; exit "$code"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.select.outputs.task == 'supabase-local-checks' || steps.select.outputs.task == 'full-checks'
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        if: steps.select.outputs.task == 'supabase-local-checks' || steps.select.outputs.task == 'full-checks'
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        if: steps.select.outputs.task == 'supabase-local-checks' || steps.select.outputs.task == 'full-checks'
        run: |
          set -euo pipefail
          supabase start >> "$OPS_LOG" 2>&1
          supabase db reset --local >> "$OPS_LOG" 2>&1
          supabase db lint --local --schema public --fail-on error >> "$OPS_LOG" 2>&1
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts >> "$OPS_LOG" 2>&1
          echo 'Local Supabase migrations, schema lint, and Edge Function type checks passed.' >> "$OPS_LOG"
        timeout-minutes: 20

      - name: Stop local Supabase
        if: always() && (steps.select.outputs.task == 'supabase-local-checks' || steps.select.outputs.task == 'full-checks')
        run: if command -v supabase >/dev/null 2>&1; then supabase stop --no-backup >> "$OPS_LOG" 2>&1 || true; fi

      - name: Redact and summarize operation output
        if: always() && steps.select.outputs.task != ''
        env:
          TASK: ${{ steps.select.outputs.task }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/redact_gha_ops_log.py "$OPS_LOG" "$RUNNER_TEMP/detail-ops-result.txt"
          {
            echo "## GitHub operation result"
            echo
            echo "- Task: \`$TASK\`"
            echo "- Workflow result: \`$JOB_STATUS\`"
            echo "- Detailed output: available in the attached redacted artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.task != ''
        with:
          name: detail-ops-${{ github.run_id }}
          path: ${{ runner.temp }}/detail-ops-result.txt
          if-no-files-found: warn
          retention-days: 3

  production-readonly:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.task == 'supabase-migration-list' || inputs.task == 'supabase-migration-dry-run' || inputs.task == 'waitlist-migration-dry-run')
    name: Read-only production diagnostics
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      OPS_LOG: ${{ github.workspace }}/detail-ops.log
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit production confirmation on main
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm_production_access }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == 'true' ]] || { echo 'Set confirm_production_access only after reviewing the selected read-only operation.'; exit 1; }
          [[ "$REF" == 'refs/heads/main' ]] || { echo 'Production diagnostics may run only from main.'; exit 1; }
          printf 'Selected production read-only operation: %s\n' "$TASK" > "$OPS_LOG"

      - uses: supabase/setup-cli@v1
        if: inputs.task == 'supabase-migration-list' || inputs.task == 'supabase-migration-dry-run'
        with:
          version: latest

      - name: Validate Supabase CLI credentials
        if: inputs.task == 'supabase-migration-list' || inputs.task == 'supabase-migration-dry-run'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD.'; exit 1; }

      - name: Inspect migration status or preview pending migrations
        if: inputs.task == 'supabase-migration-list' || inputs.task == 'supabase-migration-dry-run'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" >> "$OPS_LOG" 2>&1; then
            echo 'Supabase project linked.' >> "$OPS_LOG"
          else
            code=$?; echo "Supabase project link failed (exit $code)." >> "$OPS_LOG"; exit "$code"
          fi
          if [[ "$TASK" == 'supabase-migration-list' ]]; then
            supabase migration list --linked >> "$OPS_LOG" 2>&1
          else
            supabase db push --dry-run >> "$OPS_LOG" 2>&1
          fi

      - name: Dry-run legacy D1 data migration
        if: inputs.task == 'waitlist-migration-dry-run'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXECUTE_MIGRATION: 'false'
        run: python scripts/migrate_cloudflare_waitlist_to_supabase.py >> "$OPS_LOG" 2>&1

      - name: Redact and summarize production output
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          PAYNOW_INTEGRATION_ID: ${{ secrets.PAYNOW_INTEGRATION_ID }}
          PAYNOW_INTEGRATION_KEY: ${{ secrets.PAYNOW_INTEGRATION_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ inputs.task }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/redact_gha_ops_log.py "$OPS_LOG" "$RUNNER_TEMP/detail-ops-result.txt"
          {
            echo "## GitHub operation result"
            echo
            echo "- Task: \`$TASK\`"
            echo "- Workflow result: \`$JOB_STATUS\`"
            echo "- Detailed output: available in the attached redacted artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-production-ops-${{ github.run_id }}
          path: ${{ runner.temp }}/detail-ops-result.txt
          if-no-files-found: warn
          retention-days: 3

  live-provider-e2e:
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-paynow-e2e' || inputs.task == 'live-didit-e2e' || inputs.task == 'live-email-e2e' || inputs.task == 'live-sms-e2e' || inputs.task == 'live-provider-e2e')
    name: Live provider checks (status only)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require explicit live test confirmation
        id: preflight
        env:
          TASK: ${{ inputs.task }}
          REF: ${{ github.ref }}
          CONFIRM_ACCESS: ${{ inputs.confirm_live_access }}
          CONFIRM_SIDE_EFFECTS: ${{ inputs.confirm_live_side_effects }}
        run: |
          set -euo pipefail
          [[ "$REF" == 'refs/heads/main' || "$REF" == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh' ]] || { echo 'LIVE_SUITE: FAIL'; exit 1; }
          [[ "$CONFIRM_ACCESS" == 'true' ]] || { echo 'LIVE_SUITE: FAIL'; exit 1; }
          case "$TASK" in
            live-paynow-e2e|live-didit-e2e|live-email-e2e|live-sms-e2e|live-provider-e2e)
              [[ "$CONFIRM_SIDE_EFFECTS" == 'true' ]] || { echo 'LIVE_SUITE: FAIL'; exit 1; }
              ;;
            live-readiness|live-core-readiness) ;;
            *) echo 'LIVE_SUITE: FAIL'; exit 1 ;;
          esac
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

      - name: Install Paynow SDK for checkout test
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-paynow-e2e' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        run: npm ci --prefix functions --silent --no-audit --no-fund > "$RUNNER_TEMP/live-test-install.log" 2>&1

      - name: Verify Supabase public key injection (no value output)
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_ANON: ${{ secrets.SUPABASE_PUBLIC_ANON }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.SUPABASE_PUBLIC_ANON;
          const alias = process.env.SUPABASE_ANON_KEY;
          console.log(`SUPABASE_PUBLIC_ANON_DEFINED: ${key === undefined ? 'NO' : 'YES'}`);
          console.log(`SUPABASE_PUBLIC_ANON_NONEMPTY: ${key?.trim() ? 'YES' : 'NO'}`);
          console.log(`SUPABASE_PUBLIC_ANON_PREFIX_VALID: ${key?.trim().startsWith('sb_publishable_') ? 'YES' : 'NO'}`);
          console.log(`SUPABASE_ANON_ALIAS_MATCHES_PUBLIC: ${key && alias === key ? 'YES' : 'NO'}`);
          try {
            console.log(`SUPABASE_URL_PROJECT_REF_MATCH: ${new URL(process.env.SUPABASE_URL).hostname === 'yiyhmueospjwbaywzusp.supabase.co' ? 'YES' : 'NO'}`);
          } catch {
            console.log('SUPABASE_URL_PROJECT_REF_MATCH: NO');
          }
          NODE

      - name: Install Supabase SDK for read-only live check
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        run: npm ci --prefix functions --silent --no-audit --no-fund > "$RUNNER_TEMP/supabase-sdk-install.log" 2>&1

      - name: Test public and secret keys through Supabase SDK
        id: supabaseSdk
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_ANON: ${{ secrets.SUPABASE_PUBLIC_ANON }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/live_supabase_sdk_check.mjs

      - name: Check Supabase auth, REST, and deployed marketplace read route
        id: supabase
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/live_provider_checks.mjs supabase

      - name: Check Twilio account credentials
        id: twilio
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: node scripts/live_provider_checks.mjs twilio

      - name: Check Resend account and sender domain
        id: resend
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/live_provider_checks.mjs resend

      - name: Check Mapbox style access
        id: mapbox
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-readiness' || inputs.task == 'live-core-readiness' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: node scripts/live_provider_checks.mjs mapbox

      - name: Initialize an unpaid Paynow checkout
        id: paynow
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-paynow-e2e' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          PAYNOW_INTEGRATION_ID: ${{ secrets.PAYNOW_INTEGRATION_ID }}
          PAYNOW_INTEGRATION_KEY: ${{ secrets.PAYNOW_INTEGRATION_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/live_provider_checks.mjs paynow-e2e

      - name: Create a test Didit verification session
        id: didit
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-didit-e2e' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/live_provider_checks.mjs didit-e2e

      - name: Send a test email to the configured test recipient
        id: email
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-email-e2e' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LIVE_E2E_EMAIL_TO: ${{ secrets.LIVE_E2E_EMAIL_TO }}
        run: node scripts/live_provider_checks.mjs email-e2e

      - name: Send a test SMS to the configured test recipient
        id: sms
        if: always() && steps.preflight.outputs.authorized == 'true' && (inputs.task == 'live-sms-e2e' || inputs.task == 'live-provider-e2e')
        continue-on-error: true
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          LIVE_E2E_SMS_TO: ${{ secrets.LIVE_E2E_SMS_TO }}
        run: node scripts/live_provider_checks.mjs sms-e2e

      - name: Summarize live test statuses only
        if: always()
        env:
          TASK: ${{ inputs.task }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          SUPABASE_RESULT: ${{ steps.supabase.outcome }}
          SUPABASE_SDK_RESULT: ${{ steps.supabaseSdk.outcome }}
          TWILIO_RESULT: ${{ steps.twilio.outcome }}
          RESEND_RESULT: ${{ steps.resend.outcome }}
          MAPBOX_RESULT: ${{ steps.mapbox.outcome }}
          PAYNOW_RESULT: ${{ steps.paynow.outcome }}
          DIDIT_RESULT: ${{ steps.didit.outcome }}
          EMAIL_RESULT: ${{ steps.email.outcome }}
          SMS_RESULT: ${{ steps.sms.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != 'success' ]]; then echo 'LIVE_SUITE: FAIL' >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          failed=0
          {
            echo '## Live integration test statuses'
            echo
            printf -- '- Suite: %s\n' "$TASK"
          } >> "$GITHUB_STEP_SUMMARY"
          for item in "Supabase REST:$SUPABASE_RESULT" "Supabase SDK:$SUPABASE_SDK_RESULT" "Twilio account:$TWILIO_RESULT" "Resend account:$RESEND_RESULT" "Mapbox:$MAPBOX_RESULT" "Paynow:$PAYNOW_RESULT" "Didit:$DIDIT_RESULT" "Email delivery:$EMAIL_RESULT" "SMS delivery:$SMS_RESULT"; do
            name="${item%%:*}"; result="${item#*:}"
            [[ "$result" == 'skipped' ]] && continue
            if [[ "$result" == 'success' ]]; then status='PASS'; else status='FAIL'; failed=1; fi
            printf -- '- %s: %s\n' "$name" "$status" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$failed" -eq 0 ]]; then echo 'LIVE_SUITE: PASS'; else echo 'LIVE_SUITE: FAIL'; exit 1; fi
