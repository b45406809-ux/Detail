name: Deploy feature backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-supabase
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate migrations and function
        run: |
          supabase start
          supabase db reset --local
          supabase test db --local > "$RUNNER_TEMP/detail-db-tests.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/detail-db-tests.log" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/detail-db-tests.log"
            exit 1
          }
          supabase db lint --local --schema public --fail-on error
          deno check --config supabase/functions/deno.json supabase/functions/marketplace-api/index.ts
      - name: Apply pending migrations and deploy API
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run
          supabase db push --yes
          supabase functions deploy marketplace-api --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
