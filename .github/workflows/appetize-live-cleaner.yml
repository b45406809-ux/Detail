name: Appetize live cleaner journey
on:
  workflow_dispatch:
    inputs:
      appetize_build_id:
        description: Immutable Android Appetize target ID
        required: true
        type: string
      eas_build_id:
        description: EAS build ID represented by the selected Appetize target
        required: true
        type: string
      source_commit:
        description: Full 40-character source commit for the selected EAS build
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleaner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_BUILD_ID: ${{ inputs.appetize_build_id }}
      EAS_BUILD_ID: ${{ inputs.eas_build_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_PUBLIC_ANON: ${{ secrets.SUPABASE_PUBLIC_ANON || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live booking gate
        run: node scripts/live_mobile_ui_e2e.mjs preflight
      - run: npm install --global @appetize/cli@0.25.1 --no-audit --no-fund
      - name: Validate pinned Android artifact
        run: |
          set -euo pipefail
          [[ "$APPETIZE_BUILD_ID" =~ ^[a-z0-9]{20,32}$ ]]
          [[ "$EAS_BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          appetize build list --app com.detail.app --limit 200 --json --quiet > "$RUNNER_TEMP/appetize-builds.json"
          APPETIZE_BUILD_ID="$APPETIZE_BUILD_ID" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { builds = [] } = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/appetize-builds.json`, 'utf8'));
          const target = builds.find(build => build.id === process.env.APPETIZE_BUILD_ID);
          if (!target) throw new Error('The requested Appetize build ID is unavailable for com.detail.app.');
          if (target.platform !== 'android') throw new Error('The requested Appetize target is not Android.');
          console.log(`PINNED_APPETIZE_TARGET: ${target.id}`);
          NODE
          {
            echo '## Pinned Android Appetize cleaner journey'
            echo
            echo "- Appetize build ID: \`$APPETIZE_BUILD_ID\`"
            echo "- EAS build ID: \`$EAS_BUILD_ID\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create confirmed disposable accounts
        run: node scripts/live_mobile_ui_e2e.mjs create
      - name: Verify live backend rejects unverified cleaner actions
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.SUPABASE_URL.replace(/\/$/, '');
            const key = process.env.SUPABASE_PUBLIC_ANON;
            if (!key) throw new Error('Missing Supabase public key.');
            const headers = { apikey: key, 'content-type': 'application/json' };
            const auth = await fetch(`${base}/auth/v1/token?grant_type=password`, { method:'POST', headers, body:JSON.stringify({email:process.env.E2E_CLEANER_EMAIL,password:process.env.E2E_CLEANER_PASSWORD}) });
            if (!auth.ok) throw new Error(`Test account authentication failed: HTTP ${auth.status}`);
            const session = await auth.json();
            if (!session.access_token) throw new Error('Authentication returned no token.');
            for (const [name,data] of [
              ['submitCleanerApplication',{fullName:'E2E Cleaner',phone:'0712345678',address:'Test address Harare',serviceArea:'Harare',serviceCategories:['HOUSE'],serviceRadiusKm:15,experienceYears:0}],
              ['setActiveRole',{role:'CLEANER'}],
            ]) {
              const response = await fetch(`${base}/functions/v1/marketplace-api`, { method:'POST', headers:{...headers,authorization:`Bearer ${session.access_token}`}, body:JSON.stringify({name,data}) });
              if (response.status !== 409) throw new Error(`${name}: expected HTTP 409, received HTTP ${response.status}`);
              console.log(`UNVERIFIED_CLEANER_BLOCKED: ${name}`);
            }
          })().catch(error => {console.error(error.message);process.exitCode=1});
          NODE
      - name: Sign in through Android UI
        run: |
          set -euo pipefail
          mkdir -p appetize-results
          target="$APPETIZE_BUILD_ID"
          trap 'appetize inspect appetize-results/final.json --json --quiet || true; appetize screenshot appetize-results/final.png --json --quiet || true; appetize session stop --json --quiet || true' EXIT
          appetize session start pixel7 --target "$target" --json --quiet >/dev/null
          appetize inspect --select-test-id welcome-skip --timeout 25000 --json --quiet
          appetize tap --select-test-id welcome-skip --json --quiet
          appetize inspect --select-test-id auth-email-tab --timeout 15000 --json --quiet
          appetize tap --select-test-id auth-email-tab --json --quiet
          appetize tap --select-test-id auth-email-mode-password --json --quiet
          appetize tap --select-test-id auth-email-input --json --quiet
          appetize type "$E2E_CLEANER_EMAIL" --json --quiet
          appetize tap --select-test-id auth-password-input --json --quiet
          appetize type "$E2E_CLEANER_PASSWORD" --json --quiet
          appetize press back --json --quiet
          appetize tap --select-test-id auth-email-submit --json --quiet
          appetize inspect appetize-results/agreement.json --select-text 'Customer Agreement' --timeout 25000 --json --quiet
          appetize screenshot appetize-results/agreement.png --json --quiet
          for attempt in $(seq 1 12); do
            if appetize inspect --select-text '/^I have read and accept$/i' --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
            appetize swipe --direction up --json --quiet
          done
          appetize tap --select-text '/^I have read and accept$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Set up your profile' --timeout 20000 --json --quiet
          appetize tap --select-text 'Your full name' --timeout 10000 --json --quiet
          appetize type 'E2E Live Cleaner' --json --quiet
          appetize press back --json --quiet
          appetize tap --select-text 'Offer Cleaning Services' --timeout 10000 --json --quiet
          appetize tap --select-text '/^Continue$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Allow permissions' --timeout 20000 --json --quiet
          appetize tap --select-text '/^Continue to App$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Cleaner' --timeout 25000 --json --quiet
          appetize tap --select-text 'Cleaner' --json --quiet
          appetize inspect --select-text 'Cleaner Registration Required' --timeout 15000 --json --quiet
          appetize tap --select-text '/^Register Now$/i' --json --quiet
          for slide in 'Work with Detail' 'Your earnings' 'When you get paid' 'Direct payments'; do
            appetize inspect --select-text "$slide" --timeout 15000 --json --quiet
            appetize tap --select-text '/^Continue$/i' --timeout 10000 --json --quiet
          done
          appetize inspect --select-text 'Deliver with care' --timeout 15000 --json --quiet
          appetize tap --select-text '/^Start registration$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Become a Cleaner' --timeout 20000 --json --quiet
          appetize tap --select-text '+263 7X XXX XXXX' --timeout 10000 --json --quiet
          appetize type '0712345678' --json --quiet
          appetize press back --json --quiet
          appetize tap --select-text 'Street, suburb, city' --timeout 10000 --json --quiet
          appetize type 'Test address Harare' --json --quiet
          appetize press back --json --quiet
          for attempt in $(seq 1 5); do
            if appetize inspect --select-text 'House Cleaning' --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
            appetize swipe --direction up --json --quiet
          done
          appetize tap --select-text 'House Cleaning' --timeout 10000 --json --quiet
          for attempt in $(seq 1 8); do
            if appetize inspect --select-text 'Verify with Didit' --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
            appetize swipe --direction up --json --quiet
          done
          appetize inspect --select-text 'Verify with Didit' --timeout 10000 --json --quiet
          appetize screenshot appetize-results/cleaner-registration.png --json --quiet
          for attempt in $(seq 1 8); do
            if appetize inspect --select-text '/^Continue to Agreement$/i' --timeout 500 --json --quiet >/dev/null 2>&1; then break; fi
            appetize swipe --direction up --json --quiet
          done
          appetize tap --select-text '/^Continue to Agreement$/i' --timeout 10000 --json --quiet
          appetize inspect --select-text 'Identity check required' --timeout 10000 --json --quiet
          echo 'LIVE_CLEANER_DIDIT_GATE_REACHED'
      - name: Clean up disposable accounts
        if: always()
        run: node scripts/live_mobile_ui_e2e.mjs cleanup
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appetize-live-cleaner-${{ github.run_id }}
          path: appetize-results/
          if-no-files-found: ignore
          retention-days: 7
