name: Submit Android bundle to Google Play internal testing

on:
  push:
    branches:
      - codex/separate-dashboard-into-routed-modules-fl7jlh
    paths:
      - .github/workflows/submit-android-play-once.yml

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Download the successful Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: detail-android-production-44988636438
          path: ${{ runner.temp }}/detail-android
          github-token: ${{ github.token }}
          run-id: 44988636438

      - name: Locate Android app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/detail-android" -maxdepth 2 -type f -name '*.aab' -print -quit)"
          test -n "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: zw.co.detailapp.mobile
          releaseFiles: ${{ steps.bundle.outputs.path }}
          track: internal
          status: completed
