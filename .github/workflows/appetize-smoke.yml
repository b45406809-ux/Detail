name: Appetize Android inspection
on:
  workflow_dispatch:
    inputs:
      appetize_build_id:
        description: Explicit Appetize build target
        required: true
        type: string
      source_commit:
        description: Source commit used to build this target
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_BUILD_ID: ${{ inputs.appetize_build_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @appetize/cli@0.25.1 --no-audit --no-fund
      - name: Inspect pinned uploaded build
        run: |
          set -euo pipefail
          mkdir -p appetize-results
          [[ "$APPETIZE_BUILD_ID" =~ ^[a-z0-9]{20,32}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          target="$APPETIZE_BUILD_ID"
          echo "Source commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Current Appetize build: https://appetize.io/app/$target" >> "$GITHUB_STEP_SUMMARY"
          echo "Appetize link: https://appetize.io/app/$target"
          trap 'appetize session stop --json --quiet || true' EXIT
          appetize session start pixel7 --target "$target" --json --quiet > appetize-results/session.json
          appetize inspect appetize-results/launch.json --json --quiet
          appetize screenshot appetize-results/launch.png --json --quiet
          appetize tap --select-test-id welcome-skip --json --quiet
          appetize inspect appetize-results/sign-in.json --select-text 'Welcome back' --timeout 15000 --json --quiet
          appetize screenshot appetize-results/sign-in.png --json --quiet
          appetize tap --select-test-id auth-account-mode-toggle --json --quiet
          appetize inspect appetize-results/create-account.json --select-text 'Join Detail' --timeout 15000 --json --quiet
          appetize inspect appetize-results/email.json --select-test-id auth-email-input --timeout 10000 --json --quiet
          appetize inspect appetize-results/password.json --select-test-id auth-password-input --timeout 10000 --json --quiet
          appetize screenshot appetize-results/create-account.png --json --quiet
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appetize-inspection-${{ github.run_id }}
          path: appetize-results/
          if-no-files-found: ignore
          retention-days: 7
