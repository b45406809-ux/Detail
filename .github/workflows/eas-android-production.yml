name: Build Detail Android on EAS

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload the built app bundle to a Google Play testing or production track.
        required: false
        type: boolean
        default: false
      play_track:
        description: Google Play track to receive the uploaded app bundle.
        required: true
        type: choice
        options:
          - internal
          - production
        default: internal

permissions:
  contents: read

concurrency:
  group: eas-android-production
  cancel-in-progress: false

jobs:
  build:
    name: Configure production tokens and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate build credentials are configured
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$MAPBOX_DOWNLOADS_TOKEN"
          test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"

      - run: npm ci --prefix mobile --no-audit --no-fund

      - name: Verify Mapbox SDK download access
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "mapbox:$MAPBOX_DOWNLOADS_TOKEN" 'https://api.mapbox.com/downloads/v2/releases/maven/com/mapbox/maps/android/10.18.4/android-10.18.4.pom')"
          if [[ "$status" != '200' ]]; then
            echo "Mapbox rejected the downloads token (HTTP $status). Configure MAPBOX_DOWNLOADS_TOKEN with DOWNLOADS:READ scope."
            exit 1
          fi

      - name: Set Mapbox tokens in EAS production environment
        working-directory: mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest env:set production --scope project --name MAPBOX_DOWNLOADS_TOKEN --value "$MAPBOX_DOWNLOADS_TOKEN" --visibility secret --non-interactive
          npx eas-cli@latest env:set production --scope project --name EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN --value "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" --visibility plaintext --non-interactive

      - name: Build Android production app on EAS
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/detail-android-eas.log"
          if npx eas-cli@latest build --platform android --profile production --non-interactive --wait >"$build_log" 2>&1; then
            cat "$build_log"
            echo 'EAS remote Android build completed.'
          else
            build_status=$?
            tail -n 35 "$build_log"
            if ! grep -Eq 'This account has used its (Android )?builds from the Free plan' "$build_log"; then
              exit "$build_status"
            fi
            echo 'Expo free Android build quota is exhausted; falling back to a local signed production build.'
            npx eas-cli@latest build --platform android --profile production --non-interactive --local --output "$RUNNER_TEMP/detail-production.aab"
          fi

      - name: Report Android app bundle size breakdown
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/detail-production.aab"
          if [[ ! -f "$aab" ]]; then echo 'No local bundle to measure (built remotely on EAS).'; exit 0; fi
          python3 - "$aab" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys, zipfile, collections
          path = sys.argv[1]
          mb = lambda n: f"{n / 1048576:.1f} MB"
          z = zipfile.ZipFile(path)
          groups, libs = collections.Counter(), collections.Counter()
          for i in z.infolist():
              parts = i.filename.split('/')
              if len(parts) > 2 and parts[1] == 'lib':
                  groups[f"native libs ({parts[2]})"] += i.compress_size
                  libs[parts[-1]] += i.compress_size
              elif len(parts) > 1 and parts[1] == 'dex':
                  groups['dex (Java/Kotlin code)'] += i.compress_size
              elif len(parts) > 1 and parts[1] in ('assets', 'res'):
                  groups[parts[1]] += i.compress_size
              else:
                  groups['other'] += i.compress_size
          print(f"### Android bundle: {mb(os.path.getsize(path))}")
          print("| Part | Compressed |\n|---|---|")
          for k, v in groups.most_common(): print(f"| {k} | {mb(v)} |")
          print("\n### Largest native libraries (all ABIs)\n| Library | Compressed |\n|---|---|")
          for k, v in libs.most_common(15): print(f"| {k} | {mb(v)} |")
          PY

      - name: Upload locally built Android app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detail-android-production-${{ github.run_id }}
          path: ${{ runner.temp }}/detail-production.aab
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: Upload app bundle to Google Play ${{ inputs.play_track }}
    needs: build
    if: inputs.upload_to_play
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: detail-android-production-${{ github.run_id }}
          path: ${{ runner.temp }}/detail-android

      - name: Locate Android app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/detail-android" -maxdepth 2 -type f -name '*.aab' -print -quit)"
          if [[ -z "$bundle" ]]; then echo 'No app bundle artifact; the build ran remotely on EAS. Submit it from EAS instead.'; exit 1; fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: zw.co.detailapp.mobile
          releaseFiles: ${{ steps.bundle.outputs.path }}
          tracks: ${{ inputs.play_track }}
          status: completed
