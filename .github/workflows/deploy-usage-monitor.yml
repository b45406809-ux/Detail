name: Deploy usage monitor from active branch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-usage-monitor
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate target and deployment credentials
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = yiyhmueospjwbaywzusp
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Apply repository migrations
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --remote --yes
      - name: Deploy marketplace API with snapshot support
        run: supabase functions deploy marketplace-api --project-ref "$SUPABASE_PROJECT_REF" --yes
