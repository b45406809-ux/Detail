name: Paynow mobile payment diagnostic
on:
  workflow_dispatch:
    inputs:
      phone:
        description: EcoCash phone number for one real payment request
        required: true
        type: string
      email:
        description: Payer email
        required: true
        type: string
      confirm_live_payment:
        description: Confirm a real USD 2 payment prompt may be sent
        required: true
        type: boolean
        default: false
      connectivity_only:
        description: Check connectivity without creating a payment
        required: false
        type: boolean
        default: false
      runtime:
        description: Runtime for the payment request
        required: true
        type: choice
        options: [deno, node]
        default: deno
permissions:
  contents: read
jobs:
  diagnostic:
    if: (inputs.confirm_live_payment == true || inputs.connectivity_only == true) && github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      PAYNOW_TEST_ID: ${{ secrets.PAYNOW_SANDBOX_INTEGRATION_ID }}
      PAYNOW_TEST_KEY: ${{ secrets.PAYNOW_SANDBOX_INTEGRATION_KEY }}
      PAYNOW_TEST_PHONE: ${{ inputs.phone }}
      PAYNOW_TEST_EMAIL: ${{ inputs.email }}
      PAYNOW_TEST_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      PAYNOW_CONNECTIVITY_ONLY: ${{ inputs.connectivity_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        if: inputs.runtime == 'node' && inputs.connectivity_only == false
        with:
          node-version: 22
      - name: Install Paynow SDK for Node diagnostic
        if: inputs.runtime == 'node' && inputs.connectivity_only == false
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Send one EcoCash request and check its status
        if: inputs.runtime == 'deno' || inputs.connectivity_only == true
        run: deno run --allow-env --allow-net --allow-read supabase/functions/_shared/paynow_live_diagnostic.ts
      - name: Send one EcoCash request with Node and check its status
        if: inputs.runtime == 'node' && inputs.connectivity_only == false
        run: node --experimental-strip-types scripts/paynow_node_diagnostic.mjs
      - name: Compare Node and curl connectivity
        if: always() && inputs.connectivity_only == true
        run: |
          node -e 'fetch("https://www.paynow.co.zw/interface/remotetransaction", {method:"HEAD",signal:AbortSignal.timeout(10000)}).then(r => console.log("Node HTTPS status:",r.status)).catch(e => console.log("Node HTTPS error:",e.message,"cause:",e.cause?.message))'
          curl -4 -sS -I --max-time 10 -o /dev/null -w 'curl IPv4 HTTPS status: %{http_code}\n' https://www.paynow.co.zw/interface/remotetransaction || true
          curl -6 -sS -I --max-time 10 -o /dev/null -w 'curl IPv6 HTTPS status: %{http_code}\n' https://www.paynow.co.zw/interface/remotetransaction || true
          deno eval 'try { const client = Deno.createHttpClient({http2: false}); const r = await fetch("https://www.paynow.co.zw/interface/remotetransaction", {method:"HEAD",client,signal:AbortSignal.timeout(10000)}); console.log("Deno HTTP/1.1 status:", r.status); client.close(); } catch(e) { console.log("Deno HTTP/1.1 error:",e.message,"cause:",e.cause?.message); }'
