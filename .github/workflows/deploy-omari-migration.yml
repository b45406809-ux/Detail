name: Deploy Omari payment migration

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Apply pending migrations from the selected branch to the production Supabase project.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-supabase
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh' && inputs.confirm_production_deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production deployment credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD.'; exit 1; }

      - name: Link and preview pending migrations
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push --yes
