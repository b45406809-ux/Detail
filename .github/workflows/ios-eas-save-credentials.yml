name: Save iOS signing credentials to Expo

on:
  workflow_dispatch:
    inputs:
      signing_run_id:
        description: GitHub run ID that produced the short-lived iOS signing artifact
        required: true
        type: string
        default: '44203330228'

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-eas-save-credentials
  cancel-in-progress: false

jobs:
  save-credentials:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_BOT_ACCESS_TOKEN || secrets.EXPO_EAS_BOT_ACCESS_TOKEN || secrets.EAS_BOT_TOKEN_2 }}
      SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'An Expo token is missing from production.'; exit 1; }
          [[ "$SIGNING_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'The signing run ID must contain digits only.'; exit 1; }

      - name: Download signing artifact
        uses: actions/download-artifact@v4
        with:
          name: detail-ios-signing-${{ inputs.signing_run_id }}
          path: ${{ runner.temp }}/detail-ios-signing
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run_id }}

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: Prepare local credentials for the Expo import
        shell: bash
        env:
          SIGNING_DIR: ${{ runner.temp }}/detail-ios-signing
        run: |
          set -euo pipefail
          mkdir -p mobile/.eas/credentials
          cp "$SIGNING_DIR/distribution.p12" mobile/.eas/credentials/distribution.p12
          cp "$SIGNING_DIR/profile.mobileprovision" mobile/.eas/credentials/profile.mobileprovision
          node -e 'const fs=require("node:fs"); const password=fs.readFileSync(process.env.SIGNING_DIR+"/p12-password.txt","utf8").trim(); fs.writeFileSync("mobile/credentials.json", JSON.stringify({ios:{provisioningProfilePath:".eas/credentials/profile.mobileprovision",distributionCertificate:{path:".eas/credentials/distribution.p12",password}},}, null, 2));'

      - name: Upload the certificate and profile to the Expo project
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y expect >/dev/null
          cat > "$RUNNER_TEMP/import-ios-credentials.exp" <<'EXPECT'
          set timeout 180
          spawn npx --yes eas-cli@16.28.0 credentials --platform ios

          expect {
            -re {Which build profile do you want to configure\?} {
              # eas.json profile order: development, preview, staging-android,
              # staging-ios-simulator, production. Choose production.
              send "\033\[B\033\[B\033\[B\033\[B\r"
            }
            timeout { puts stderr "Timed out waiting for the iOS build profile selection."; exit 1 }
            eof { puts stderr "EAS credentials command exited before profile selection."; exit 1 }
          }

          expect {
            -re {Do you want to log in to your Apple account\?} {
              # Apple login is optional because the signing files were already created by GitHub Actions.
              send "n\r"
              exp_continue
            }
            -re {❯.*Build Credentials: Manage everything needed to build your project} {
              # Move only after each active selection is visible, avoiding stale key events.
              after 1500
              send -- "\033\[B"
              expect -re {❯.*Push Notifications: Manage your Apple Push Notifications Key}
              send -- "\033\[B"
              expect -re {❯.*App Store Connect: Manage your API Key}
              send -- "\033\[B"
              expect -re {❯.*credentials.json: Upload/Download credentials between EAS servers and your local json}
              send -- "\r"
            }
            timeout { puts stderr "Timed out waiting for the EAS iOS credentials menu."; exit 1 }
            eof { puts stderr "EAS credentials command exited before the credentials menu."; exit 1 }
          }

          expect {
            -re {❯.*Download credentials from EAS to credentials\.json} {
              after 1000
              send -- "\033\[B"
              expect -re {❯.*Upload credentials from credentials\.json to EAS}
              send -- "\r"
            }
            timeout { puts stderr "Timed out waiting for the credentials.json menu."; exit 1 }
            eof { puts stderr "EAS credentials command exited before the upload option."; exit 1 }
          }

          expect {
            -re {Would you like to replace this configuration with credentials from credentials json\?} {
              send "y\r"
              exp_continue
            }
            -re {All credentials are ready to build} {}
            timeout { puts stderr "Timed out while importing signing credentials into Expo."; exit 1 }
            eof { puts stderr "EAS credentials command exited before confirming the import."; exit 1 }
          }

          expect {
            -re {Press any key to continue} { send "\r" }
            timeout { puts stderr "Timed out waiting for the EAS credentials menu to return."; exit 1 }
            eof { exit 0 }
          }

          expect {
            -re {What do you want to do\?} {
              # Exit the credentials manager cleanly.
              send "\033\[B\033\[B\033\[B\033\[B\033\[B\r"
            }
            timeout { puts stderr "Timed out while exiting the EAS credentials manager."; exit 1 }
          }
          expect eof
          EXPECT
          expect "$RUNNER_TEMP/import-ios-credentials.exp"
          echo 'The App Store certificate and provisioning profile are stored in the Expo project credentials.'

      - name: Remove local signing material
        if: always()
        shell: bash
        run: |
          rm -f mobile/credentials.json mobile/.eas/credentials/distribution.p12 mobile/.eas/credentials/profile.mobileprovision
          rm -rf "$RUNNER_TEMP/detail-ios-signing"
