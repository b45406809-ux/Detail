name: Emergency Git Fix

permissions:
  contents: write # Grants the workflow permission to force push updates

on:
  workflow_dispatch:

jobs:
  fix-git:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: 1. Fix the Codex Branch (Undo Accidental Merge)
        run: |
          git checkout codex/separate-dashboard-into-routed-modules-vkfdvy
          git reset --hard HEAD~1
          git push origin codex/separate-dashboard-into-routed-modules-vkfdvy --force

      - name: 2. Update the Claude Branch with Codex Changes
        run: |
          git checkout claude/cleaning-marketplace-concept-84t4wk
          git pull origin claude/cleaning-marketplace-concept-84t4wk
          git merge codex/separate-dashboard-into-routed-modules-vkfdvy --no-edit
          git push origin claude/cleaning-marketplace-concept-84t4wk
          
