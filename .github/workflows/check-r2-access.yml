name: Check Cloudflare R2 access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check access to the Detail media bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'detail-media' }}
        run: |
          node <<'NODE'
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_R2_API_TOKEN;
            const bucket = process.env.CLOUDFLARE_R2_BUCKET;
            console.log(`R2_S3_CREDENTIALS: ${process.env.CLOUDFLARE_R2_ACCESS_KEY_ID && process.env.CLOUDFLARE_R2_SECRET_ACCESS_KEY ? 'configured' : 'missing'}.`);
            if (!account || !token) {
              coreError('Cloudflare account ID or R2 API token is not configured in the production environment.');
              process.exitCode = 1;
              return;
            }
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/r2/buckets/${encodeURIComponent(bucket)}`;
            const headers = { authorization: `Bearer ${token}` };
            const response = await fetch(endpoint, { headers, signal: AbortSignal.timeout(20000) });
            if (!response.ok) {
              console.log(`R2_ACCESS: denied or unavailable (HTTP ${response.status}); check token permissions and account. No credentials were logged.`);
              process.exitCode = 1;
              return;
            }
            const result = await response.json();
            if (!result.success || result.result?.name !== bucket) {
              const safeCodes = Array.isArray(result.errors) ? result.errors.map(error => String(error.code ?? 'unknown')).join(',') : 'none';
              console.log(`R2_ACCESS: unexpected bucket response; success=${Boolean(result.success)}, resultType=${typeof result.result}, resultKeys=${Object.keys(result.result ?? {}).join(',') || 'none'}, errorCodes=${safeCodes}.`);
              process.exitCode = 1;
              return;
            }
            console.log('R2_ACCESS: allowed; Detail media bucket exists and is readable through Cloudflare management API.');
          })().catch(() => { console.error('R2_ACCESS: request failed; no credential details were logged.'); process.exitCode = 1; });
          function coreError(message) { console.error(message); }
          NODE
