name: Check Cloudflare R2 access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check whether the configured token can list R2 buckets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!account || !token) {
              coreError('Cloudflare account ID or API token is not configured in the production environment.');
              process.exitCode = 1;
              return;
            }
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/r2/buckets`, {
              headers: { authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(20000),
            });
            if (response.ok) {
              console.log('R2_ACCESS: allowed to list buckets.');
              return;
            }
            if (response.status === 403) {
              console.log('R2_ACCESS: denied (HTTP 403); token lacks permission or account access.');
              process.exitCode = 1;
              return;
            }
            if (response.status === 401) {
              console.log('R2_ACCESS: denied (HTTP 401); token is invalid or expired.');
              process.exitCode = 1;
              return;
            }
            console.log(`R2_ACCESS: inconclusive (HTTP ${response.status}); inspect this step's status only.`);
            process.exitCode = 1;
          })().catch(() => { console.error('R2_ACCESS: request failed; no credential details were logged.'); process.exitCode = 1; });
          function coreError(message) { console.error(message); }
          NODE
