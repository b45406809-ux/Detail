name: Check Cloudflare R2 access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check whether the configured token can list R2 buckets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'detail-media' }}
        run: |
          node <<'NODE'
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_R2_API_TOKEN;
            const bucket = process.env.CLOUDFLARE_R2_BUCKET;
            if (!account || !token) {
              coreError('Cloudflare account ID or R2 API token is not configured in the production environment.');
              process.exitCode = 1;
              return;
            }
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/r2/buckets`;
            const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };
            const response = await fetch(endpoint, { headers, signal: AbortSignal.timeout(20000) });
            if (!response.ok) {
              console.log(`R2_ACCESS: denied or unavailable (HTTP ${response.status}); check token permissions and account. No credentials were logged.`);
              process.exitCode = 1;
              return;
            }
            const result = await response.json();
            if (!result.success || !Array.isArray(result.result)) {
              console.log('R2_ACCESS: Cloudflare returned an unsuccessful or unexpected response.');
              process.exitCode = 1;
              return;
            }
            const exists = result.result.some(item => item.name === bucket);
            if (exists) {
              console.log('R2_ACCESS: allowed; target bucket already exists.');
              return;
            }
            const created = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify({ name: bucket, locationHint: 'weur', storageClass: 'Standard' }), signal: AbortSignal.timeout(20000) });
            const createdResult = await created.json().catch(() => ({}));
            if (created.ok && createdResult.success) {
              console.log('R2_ACCESS: allowed; target bucket created successfully.');
              return;
            }
            console.log(`R2_ACCESS: bucket creation failed (HTTP ${created.status}); check token bucket write permission. No credentials were logged.`);
            process.exitCode = 1;
          })().catch(() => { console.error('R2_ACCESS: request failed; no credential details were logged.'); process.exitCode = 1; });
          function coreError(message) { console.error(message); }
          NODE
