name: Temporary Supabase Paynow probe
on:
  workflow_dispatch:
    inputs:
      confirm_live_payment:
        description: Send one USD 2 diagnostic to the approved EcoCash number if connectivity succeeds
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: detail-temporary-paynow-probe
  cancel-in-progress: false
jobs:
  probe:
    if: inputs.confirm_live_payment == true && github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Deploy and invoke a temporary protected probe once
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_REF"
          [[ "$SUPABASE_PROJECT_REF" == 'yiyhmueospjwbaywzusp' ]]
          functions_file="$RUNNER_TEMP/functions.json"
          secrets_file="$RUNNER_TEMP/secrets.json"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > "$functions_file"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json > "$secrets_file"
          if jq -e 'any(.[]; .slug == "paynow-supabase-probe" or .name == "paynow-supabase-probe")' "$functions_file" >/dev/null || jq -e 'any(.[]; .name == "PAYNOW_PROBE_ONETIME_SECRET")' "$secrets_file" >/dev/null; then
            echo 'Probe name or secret already exists; refusing to overwrite it.'; exit 1
          fi
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf 'PAYNOW_PROBE_ONETIME_SECRET=%s\n' "$token" > "$secret_file"
          secret_set=false
          function_deployed=false
          cleanup() {
            rm -f "$secret_file"
            if [[ "$function_deployed" == true ]]; then supabase functions delete paynow-supabase-probe --project-ref "$SUPABASE_PROJECT_REF" --yes || echo 'Cleanup: function removal failed.'; fi
            if [[ "$secret_set" == true ]]; then supabase secrets unset PAYNOW_PROBE_ONETIME_SECRET --project-ref "$SUPABASE_PROJECT_REF" --yes || echo 'Cleanup: secret removal failed.'; fi
          }
          trap cleanup EXIT
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file" --yes
          secret_set=true
          supabase functions deploy paynow-supabase-probe --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes
          function_deployed=true
          reference="DETAIL-SB-DIAG-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -nc --arg reference "$reference" '{phone:"0787213818",email:"crzzphillip@gmail.com",reference:$reference}')"
          echo 'Sending one Supabase probe; a successful connection can trigger one USD 2 EcoCash prompt. This does not credit a wallet.'
          curl --silent --show-error --fail-with-body --max-time 45 --retry 0 \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data "$payload" "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/paynow-supabase-probe"
