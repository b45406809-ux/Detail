name: Temporary Supabase Paynow probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: detail-temporary-paynow-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Deploy and invoke a temporary protected probe once
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_REF"
          [[ "$SUPABASE_PROJECT_REF" == 'yiyhmueospjwbaywzusp' ]]
          functions_file="$RUNNER_TEMP/functions.json"
          secrets_file="$RUNNER_TEMP/secrets.json"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > "$functions_file"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json > "$secrets_file"
          if jq -e 'any(.[]; .slug == "paynow-supabase-probe" or .name == "paynow-supabase-probe")' "$functions_file" >/dev/null || jq -e 'any(.[]; .name == "PAYNOW_PROBE_ONETIME_SECRET")' "$secrets_file" >/dev/null; then
            echo 'Probe name or secret already exists; refusing to overwrite it.'; exit 1
          fi
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf 'PAYNOW_PROBE_ONETIME_SECRET=%s\n' "$token" > "$secret_file"
          secret_set=false
          function_deployed=false
          cleanup() {
            rm -f "$secret_file"
            if [[ "$function_deployed" == true ]]; then supabase functions delete paynow-supabase-probe --project-ref "$SUPABASE_PROJECT_REF" --yes || echo 'Cleanup: function removal failed.'; fi
            if [[ "$secret_set" == true ]]; then supabase secrets unset PAYNOW_PROBE_ONETIME_SECRET --project-ref "$SUPABASE_PROJECT_REF" --yes || echo 'Cleanup: secret removal failed.'; fi
          }
          trap cleanup EXIT
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file" --yes
          secret_set=true
          supabase functions deploy paynow-supabase-probe --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes
          function_deployed=true
          for region in us-east-1 eu-west-1 eu-west-2 eu-central-1 ap-south-1; do
            echo "Requested region $region"
            curl --silent --show-error --fail-with-body --max-time 25 --retry 0 \
              -H "Authorization: Bearer $token" -H "x-region: $region" --data '{}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/paynow-supabase-probe?forceFunctionRegion=$region" || true
            echo
          done
  cloudflare:
    if: github.ref == 'refs/heads/codex/separate-dashboard-into-routed-modules-fl7jlh'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe Paynow with an empty form from a temporary Worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          cd "$RUNNER_TEMP"
          printf '%s\n' 'export default {async fetch(){try {const r=await fetch("https://www.paynow.co.zw/interface/remotetransaction",{method:"POST",body:"",headers:{"content-type":"application/x-www-form-urlencoded"},redirect:"manual",signal:AbortSignal.timeout(8000)});const fields=new URLSearchParams(await r.text());return Response.json({upstream:r.status,providerError:[...fields].some(([k,v])=>k.toLowerCase()==="status"&&v.toLowerCase()==="error")});}catch{return Response.json({upstream:null});}}};' > worker.mjs
          worker="detail-paynow-probe-${GITHUB_RUN_ID}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          subdomain="$(curl -fsS -H "$auth" "$api/subdomain" | jq -er '.result.subdomain')"
          curl -fsS -H "$auth" -X PUT \
            -F 'metadata={"main_module":"worker.mjs","compatibility_date":"2026-09-18"};type=application/json' \
            -F 'worker.mjs=@worker.mjs;type=application/javascript+module' "$api/scripts/$worker" | jq -e '.success'
          trap 'curl -fsS -H "$auth" -X DELETE "$api/scripts/$worker" | jq -e .success' EXIT
          curl -fsS -H "$auth" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' "$api/scripts/$worker/subdomain" | jq -e '.success'
          curl -fsS --max-time 15 --retry 2 --retry-all-errors --retry-delay 3 "https://$worker.$subdomain.workers.dev/"
