name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PAYNOW_INTEGRATION_ID: ${{ secrets.PAYNOW_INTEGRATION_ID }}
      PAYNOW_INTEGRATION_KEY: ${{ secrets.PAYNOW_INTEGRATION_KEY }}
      PAYNOW_RETURN_URL: ${{ vars.PAYNOW_RETURN_URL }}
      DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY || secrets.DIDIT_KYC_SECRET_KEY }}
      DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.EXPO_RESEND_API_KEY }}
      APP_RETURN_URL: ${{ vars.APP_RETURN_URL }}
      PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate migrations and Edge Functions locally
        run: |
          supabase start
          supabase db reset --local
          supabase db lint --local --schema public --fail-on error
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing production secret SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing production variable SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing production secret SUPABASE_DB_PASSWORD'; exit 1; }
      - name: Link and apply database migrations
        run: |
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push
      - name: Configure Supabase Edge Function secrets
        shell: bash
        run: |
          secret_file="$RUNNER_TEMP/detail-supabase-secrets.env"
          : > "$secret_file"
          for name in PAYNOW_INTEGRATION_ID PAYNOW_INTEGRATION_KEY PAYNOW_RETURN_URL DIDIT_API_KEY DIDIT_WORKFLOW_ID TURNSTILE_SECRET RESEND_API_KEY APP_RETURN_URL PAYOUT_ENCRYPTION_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_MESSAGING_SERVICE_SID TWILIO_FROM_NUMBER CRON_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$secret_file"; fi
          done
          if [ -s "$secret_file" ]; then
            npx --yes supabase@latest secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          rm -f "$secret_file"
      - name: Deploy marketplace and provider functions
        run: |
          npx --yes supabase@latest functions deploy marketplace-api --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy paynow-webhook --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy paynow-return --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy marketing-unsubscribe --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy delivery-worker --project-ref "$SUPABASE_PROJECT_REF"
